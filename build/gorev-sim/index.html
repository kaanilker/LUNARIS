<body>
  <div id="ui-panel">
    <button id="ui-collapse-button" type="button" aria-expanded="true" data-t-aria="panel.daralt" data-t-title="panel.daralt">⌃</button>
    <h2 data-t="ui.baslik"></h2>
    <p class="subtitle" data-t="ui.alt"></p>
    <section id="site-evaluation" aria-live="polite">
      <div class="eval-heading" data-t="eval.baslik"></div>
      <strong id="best-site" data-t="eval.hesaplaniyor"></strong>
      <p id="selected-mission-datetime"></p>
      <p id="selected-site-evidence" aria-live="polite"></p>
      <p class="eval-caveat" data-t="eval.uyari"></p>
    </section>
    <div class="control-group">
      <button id="mission-date-button" type="button" data-t="tarih.dugme"></button>
    </div>
    <div class="control-group">
      <label for="body-focus" data-t="odak.etiket"></label>
      <select id="body-focus">
        <option value="moon" data-t="odak.ay"></option>
        <option value="earth" data-t="odak.dunya"></option>
        <option value="sun" data-t="odak.gunes"></option>
      </select>
    </div>
    <section id="sample-flights-panel" aria-labelledby="sample-flights-title">
      <button id="sample-collapse-button" type="button" aria-expanded="true" data-t-aria="ornek.daralt_etiket" data-t-title="panel.daralt">⌃</button>
      <h2 id="sample-flights-title" data-t="ornek.baslik"></h2>
      <p class="subtitle" data-t="ornek.alt"></p>
      <div id="sample-flight-list" role="list"></div>
      <div id="sample-flight-detail" aria-live="polite" hidden>
        <div class="sfd-header">
          <div class="sfd-title" id="sfd-title"></div>
          <span class="sf-badge" id="sfd-badge"></span>
        </div>
        <div class="sfd-meta" id="sfd-meta"></div>
        <div class="sfd-section-title" id="sfd-info-label" data-t="ornek.bilgi_etiket"></div>
        <p class="sfd-text" id="sfd-info"></p>
        <div class="sfd-section-title" id="sfd-reason-label" data-t="ornek.neden_etiket"></div>
        <p class="sfd-text" id="sfd-reason"></p>
        <div class="sfd-actions">
          <button type="button" class="sfd-action-btn" id="sfd-fly-btn" data-t="ornek.git"></button>
          <button type="button" class="sfd-action-btn fp" id="sfd-fp-btn" data-t="ornek.fp"></button>

          <button type="button" class="sfd-action-btn" id="sfd-alternative-btn" data-t="ornek.alternatif" hidden></button>
        </div>
        <div id="sfd-alternatives" hidden aria-live="polite">
          <div class="sfd-section-title" data-t="ornek.alternatif_baslik"></div>
          <ol id="sfd-alternative-list"></ol>
        </div>
      </div>
    </section>
  </div>

  <dialog id="mission-dialog" aria-labelledby="mission-dialog-title">
    <form id="mission-form">
      <h3 id="mission-dialog-title" data-t="tarihkutu.baslik"></h3>
      <div class="control-group">
        <label for="mission-date" data-t="tarihkutu.tarih"></label>
        <input type="date" id="mission-date" value="2026-11-15" required />
      </div>
      <div class="control-group">
        <label for="mission-time" data-t="tarihkutu.saat"></label>
        <input type="time" id="mission-time" value="12:00" required />
      </div>
      <div class="dialog-actions">
        <button id="mission-dialog-cancel" type="button" data-t="ortak.vazgec"></button>
        <button type="submit" data-t="tarihkutu.uygula"></button>
      </div>
    </form>
  </dialog>

  <aside id="landing-result-panel" aria-labelledby="landing-result-title" aria-live="polite" hidden>
    <button id="landing-result-close" type="button" data-t-aria="sonuc.kapat">×</button>
    <h2 id="landing-result-title" data-t="sonuc.baslik"></h2>
    <p id="result-mission-time"></p>
    <h3 id="result-site-name" data-t="sonuc.aday_hesaplaniyor"></h3>
    <p id="result-site-coordinates"></p>
    <p id="result-solar-elevation"></p>
    <p id="result-illumination"></p>
    <h3 data-t="sonuc.en_uygun"></h3>
    <p id="result-scan-info"></p>
    <ol id="result-candidate-list"></ol>
    <h3 data-t="sonuc.parametre"></h3>
    <ul>
      <li id="result-sun-check"></li>
      <li id="result-slope-check"></li>
      <li id="result-duration-check"></li>
      <li id="result-dem-check"></li>
    </ul>
    <p class="result-warning" data-t="sonuc.uyari"></p>
  </aside>
  <aside id="feature-info-panel" aria-labelledby="feature-info-title" aria-live="polite" hidden>
    <button id="feature-info-close" type="button" data-t-aria="bilgi.kapat">×</button>
    <p id="feature-info-category"></p>
    <h2 id="feature-info-title"></h2>
    <p id="feature-info-coordinates"></p>
    <p id="feature-info-description"></p>
    <h3 id="feature-info-detail-label" hidden></h3>
    <p id="feature-info-detail" hidden></p>
    <section id="feature-info-parameters" hidden>
      <h3 data-t="bilgi.parametreler"></h3>
      <ol>
        <li data-t-html="bilgi.p1"></li>
        <li data-t-html="bilgi.p2"></li>
        <li data-t-html="bilgi.p3"></li>
        <li data-t-html="bilgi.p4"></li>
        <li data-t-html="bilgi.p5"></li>
        <li data-t-html="bilgi.p6"></li>
        <li data-t-html="bilgi.p7"></li>
      </ol>
      <p data-t="bilgi.p_not"></p>
    </section>
    <p><a id="feature-info-source" href="https://science.nasa.gov/moon/missions/" target="_blank" rel="noopener noreferrer" data-t="bilgi.kaynak_gorevler"></a></p>
  </aside>

  <div id="timeline-container">
    <div class="timeline-header">
      <div><span data-t="zaman.etiket"></span> <span id="current-time-label" class="time-display"></span></div>
      <div id="power-status" class="status-badge" data-t="zaman.guc_bekleniyor"></div>
    </div>

  <script>
    // Dil ve sözlük: ?dil=tr|en (varsayılan tr). Sözlük dil/<kod>.json; modül betik aynı sözlüğü bekler.
    (() => {
      const kod = new URLSearchParams(location.search).get('dil') === 'en' ? 'en' : 'tr';
      document.documentElement.lang = kod;
      let sozluk = {};
      const t = (anahtar, parametre) => {
        const metin = sozluk[anahtar];
        if (metin === undefined) { console.warn(`Missing translation key: ${anahtar}`); return anahtar; }
        return parametre ? metin.replace(/\{(\w+)\}/g, (eslesen, ad) => (ad in parametre ? parametre[ad] : eslesen)) : metin;
      };
      const sozlukYukle = async (k) => {
        const yanit = await fetch(`./dil/${k}.json`);
        if (!yanit.ok) throw new Error(`HTTP ${yanit.status} for dil/${k}.json`);
        return yanit.json();
      };
      const doldur = () => {
        document.title = t('sayfa.baslik');
        for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t);
        for (const el of document.querySelectorAll('[data-t-html]')) el.innerHTML = t(el.dataset.tHtml);
        for (const el of document.querySelectorAll('[data-t-aria]')) el.setAttribute('aria-label', t(el.dataset.tAria));
        for (const el of document.querySelectorAll('[data-t-title]')) el.title = t(el.dataset.tTitle);
      };
      const hazir = (async () => {
        try {
          sozluk = await sozlukYukle(kod);
        } catch (hata) {
          console.warn(`Could not load the "${kod}" dictionary, falling back to "tr"`, hata);
          try { sozluk = await sozlukYukle('tr'); } catch (hata2) { console.warn('The "tr" dictionary could not be loaded either; keys will be shown', hata2); }
        }
        doldur();
      })();
      window.LUNARIS_DIL = { kod, t, hazir };

      const bindCollapse = (panelId, btnId) => {
        const panel = document.getElementById(panelId);
        const button = document.getElementById(btnId);
        if (!panel || !button) return;
        button.addEventListener('click', () => {
          const collapsed = panel.classList.toggle('panel-collapsed');
          button.textContent = collapsed ? '⌄' : '⌃';
          button.setAttribute('aria-expanded', String(!collapsed));
          const etiket = t(collapsed ? 'panel.ac' : 'panel.daralt');
          button.setAttribute('aria-label', etiket);
          button.title = etiket;
        });
      };
      bindCollapse('ui-panel', 'ui-collapse-button');
      bindCollapse('sample-flights-panel', 'sample-collapse-button');
      window.addEventListener('error', (event) => {
        const status = document.getElementById('model-status');
        if (status && event.target instanceof HTMLScriptElement) {
          status.style.borderColor = '#f87171';
          status.textContent = t('yukleme.modul_hata');
        }
      }, true);
    })();
  </script>

  <script type="importmap">

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const { t } = window.LUNARIS_DIL;
    await window.LUNARIS_DIL.hazir;
    const latDir = (lat) => (lat >= 0 ? t('yon.k') : t('yon.g'));
    const lonDir = (lon) => (lon >= 0 ? t('yon.d') : t('yon.b'));
    const konumMetni = (lat, lon) => `${Math.abs(lat).toFixed(2)}° ${latDir(lat)}, ${Math.abs(lon).toFixed(2)}° ${lonDir(lon)}`;
    const yerel = t('yerel');

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.2, 250000);
    const defaultCameraNear = camera.near;
    camera.position.set(0, -4.5, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 0.5;
    controls.maxDistance = 220000;
    controls.zoomSpeed = 0.45;
    let cameraFlight = null;
    controls.addEventListener('start', () => { cameraFlight = null; });

    const moonRadius = 2.0;
    const modelScaleFactor = 8;
    const moonSizeMultiplier = 1.8;
    const moonVisualRadius = moonRadius * modelScaleFactor * moonSizeMultiplier;
    const earthVisualDiameter = moonRadius * 2 * (12742 / 3474.8) * modelScaleFactor * 1.5;
    const sunVisualDiameter = moonRadius * 2 * (1392700 / 3474.8) * modelScaleFactor / 50;
    const sceneUnitsPerKm = moonRadius / (1737.4 * 9);
    const earthMoonDistance = Math.max(384400 * sceneUnitsPerKm, (earthVisualDiameter / 1.5) * 1.15) * 1.5;
    const earthSunDistance = 149597870 * sceneUnitsPerKm * 0.02 * 1.6;
    const initialMoonPhase = Math.PI / 2;
    const earthPosition = new THREE.Vector3(earthSunDistance, 0, 0);
    const moonPosition = new THREE.Vector3(
      earthSunDistance + Math.cos(initialMoonPhase) * earthMoonDistance,
      0,
      Math.sin(initialMoonPhase) * earthMoonDistance
    );
    const sunPosition = new THREE.Vector3(0, 0, 0);
    const UP_Y = new THREE.Vector3(0, 1, 0);

    const sunModelGroup = new THREE.Group();
    sunModelGroup.userData.focusBody = 'sun';
    scene.add(sunModelGroup);

    const earthModelGroup = new THREE.Group();
    earthModelGroup.userData.focusBody = 'earth';
    earthModelGroup.position.copy(earthPosition);
    scene.add(earthModelGroup);

    const moonMesh = new THREE.Group();
    moonMesh.userData.focusBody = 'moon';
    moonMesh.position.copy(moonPosition);
    scene.add(moonMesh);

    function createOrbitLine(radius, opacity = 0.45, segments = 512) {
      const points = [];
      for (let i = 0; i < segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
      }
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity, depthWrite: false });
      return new THREE.LineLoop(geometry, material);
    }
    const earthOrbitLine = createOrbitLine(earthSunDistance, 0.3);
    const moonOrbitLine = createOrbitLine(earthMoonDistance);
    scene.add(earthOrbitLine);
    earthModelGroup.add(moonOrbitLine);

    // Yer adları ve açıklamaları dil sözlüğündendir (yer.<sıra>.ad, grup.<g>); burada yalnız grup sırası ve koordinat durur.
    const LUNAR_PLACE_DATA = [
      [0, -89.90, 0.00],
      [0, -89.40, -137.50],
      [0, -88.80, 123.70],
      [0, -85.50, 12.90],
      [0, -84.68, -48.72],
      [0, -87.45, -5.17],
      [0, -88.14, 45.91],
      [0, -87.18, 84.31],
      [0, -88.48, -88.34],
      [0, -85.28, 53.27],
      [0, -84.44, 83.07],
      [0, -88.08, 111.20],
      [0, -85.40, 31.80],
      [1, 0.67416, 23.47314],
      [1, -3.01239, -23.42157],
      [1, -3.64530, -17.47136],
      [1, 26.13239, 3.63386],
      [1, -8.97301, 15.50019],
      [1, 20.19080, 30.77168],
      [2, -80.1276, 1.4367],
      [2, -69.3730, 32.3190],
      [2, -13.3160, 25.2510],
      [2, 44.1214, -19.5116],
      [2, -45.4446, 177.5991],
      [2, 43.0576, -51.9161],
      [2, -41.6385, -153.9852],
      [2, 7.08, -64.37],
      [2, 38.2378, -35.0017],
      [3, -43.31, -11.36],
      [3, 9.62, -20.08],
      [3, 23.73, -47.49],
      [3, 51.62, -9.33],
      [3, -58.62, -14.73],
      [3, -20.38, 128.97],
      [3, -90.00, 0.00],
      [3, 90.00, 0.00]
    ];
    const LUNAR_PLACES = LUNAR_PLACE_DATA.map(([grup, lat, lon], sira) => ({
      group: t(`grup.${grup}`), name: t(`yer.${sira}.ad`), lat, lon, desc: t(`yer.${sira}.aciklama`)
    }));

    const GRATICULE_LON_OFFSET_DEG = 0;
    const GRATICULE_LIFT = 0.0022;
    const GRATICULE_COLOR = 0xff8a1f;
    const GRATICULE_STRONG_COLOR = 0xff5500;

    let moonSurfaceRadius = moonVisualRadius;
    let moonModelRoot = null;
    let moonTextureMap = null;
    let moonShadedTexture = null;

    const ELEV_LAT_STEPS = 360;
    const ELEV_LON_STEPS = 720;
    const lunarRadiusRatioGrid = new Float32Array((ELEV_LAT_STEPS + 1) * (ELEV_LON_STEPS + 1)).fill(1.0);
    let hasElevationGrid = false;

    function latLonToUnitVector(lat, lon) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180 + GRATICULE_LON_OFFSET_DEG);
      const sinPhi = Math.sin(phi);
      return new THREE.Vector3(-sinPhi * Math.cos(theta), Math.cos(phi), sinPhi * Math.sin(theta));
    }

    function latLonToVector3(lat, lon, radius = moonSurfaceRadius) {
      return latLonToUnitVector(lat, lon).multiplyScalar(radius);
    }

    function localVectorToLatLon(localVec) {
      const len = localVec.length();
      if (len < 1e-8) return { lat: 0, lon: 0 };
      const lat = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(localVec.y / len, -1, 1)));
      let lon = THREE.MathUtils.radToDeg(Math.atan2(localVec.z, -localVec.x)) - 180 - GRATICULE_LON_OFFSET_DEG;
      lon = ((lon + 180) % 360 + 360) % 360 - 180;
      return { lat, lon };
    }

    function getSurfaceRadiusRatio(lat, lon) {
      if (!hasElevationGrid) return 1.0;
      const clampedLat = THREE.MathUtils.clamp(((lat + 90) / 180) * ELEV_LAT_STEPS, 0, ELEV_LAT_STEPS);
      const wrappedLon = ((((lon + 180) % 360 + 360) % 360) / 360) * ELEV_LON_STEPS;
      const lat0 = Math.floor(clampedLat);
      const lat1 = Math.min(ELEV_LAT_STEPS, lat0 + 1);
      const lon0 = Math.floor(wrappedLon);
      const lon1 = (lon0 + 1) % ELEV_LON_STEPS;
      const ty = clampedLat - lat0, tx = wrappedLon - lon0;
      const stride = ELEV_LON_STEPS + 1;
      return (1 - ty) * ((1 - tx) * lunarRadiusRatioGrid[lat0 * stride + lon0] + tx * lunarRadiusRatioGrid[lat0 * stride + lon1])
           + ty * ((1 - tx) * lunarRadiusRatioGrid[lat1 * stride + lon0] + tx * lunarRadiusRatioGrid[lat1 * stride + lon1]);
    }

    function getSurfaceRadiusAt(lat, lon) {
      return moonSurfaceRadius * getSurfaceRadiusRatio(lat, lon);
    }

    function buildLunarSurfaceGrid(model) {
      const sums = new Float32Array((ELEV_LAT_STEPS + 1) * (ELEV_LON_STEPS + 1));
      const counts = new Uint16Array((ELEV_LAT_STEPS + 1) * (ELEV_LON_STEPS + 1));
      moonMesh.updateMatrixWorld(true);
      model.updateMatrixWorld(true);
      const toMoonLocal = new THREE.Matrix4().copy(moonMesh.matrixWorld).invert();
      const v = new THREE.Vector3();
      let totalRadius = 0, totalVerts = 0;

      model.traverse((node) => {
        if (!node.isMesh || !node.geometry?.attributes?.position) return;
        if (!moonTextureMap && node.material?.map) moonTextureMap = node.material.map;
        const posAttr = node.geometry.attributes.position;
        const nodeToMoon = new THREE.Matrix4().multiplyMatrices(toMoonLocal, node.matrixWorld);
        for (let i = 0; i < posAttr.count; i++) {
          v.fromBufferAttribute(posAttr, i).applyMatrix4(nodeToMoon);
          const r = v.length();
          if (r > 1e-5) {
            totalRadius += r;
            totalVerts++;
            const { lat, lon } = localVectorToLatLon(v);
            const li = Math.round(THREE.MathUtils.clamp(((lat + 90) / 180) * ELEV_LAT_STEPS, 0, ELEV_LAT_STEPS));
            const loni = Math.round(THREE.MathUtils.clamp(((lon + 180) / 360) * ELEV_LON_STEPS, 0, ELEV_LON_STEPS));
            const idx = li * (ELEV_LON_STEPS + 1) + loni;
            sums[idx] += r;
            counts[idx]++;
          }
        }
      });

      const meanRadius = totalVerts > 0 ? totalRadius / totalVerts : moonVisualRadius;
      if (meanRadius > 0) {
        for (let li = 0; li <= ELEV_LAT_STEPS; li++) {
          for (let loni = 0; loni <= ELEV_LON_STEPS; loni++) {
            const idx = li * (ELEV_LON_STEPS + 1) + loni;
            lunarRadiusRatioGrid[idx] = counts[idx] > 0 ? (sums[idx] / counts[idx]) / meanRadius : 1.0;
          }
        }
        for (let pass = 0; pass < 3; pass++) {
          for (let li = 1; li < ELEV_LAT_STEPS; li++) {
            for (let loni = 0; loni <= ELEV_LON_STEPS; loni++) {
              const idx = li * (ELEV_LON_STEPS + 1) + loni;
              if (counts[idx] === 0) {
                const prevLon = (loni - 1 + ELEV_LON_STEPS) % ELEV_LON_STEPS;
                const nextLon = (loni + 1) % ELEV_LON_STEPS;
                lunarRadiusRatioGrid[idx] = 0.25 * (
                  lunarRadiusRatioGrid[(li - 1) * (ELEV_LON_STEPS + 1) + loni] +
                  lunarRadiusRatioGrid[(li + 1) * (ELEV_LON_STEPS + 1) + loni] +
                  lunarRadiusRatioGrid[li * (ELEV_LON_STEPS + 1) + prevLon] +
                  lunarRadiusRatioGrid[li * (ELEV_LON_STEPS + 1) + nextLon]
                );
              }
            }
          }
        }
        hasElevationGrid = true;
        buildElevationDataTexture();
      }
      return meanRadius;
    }

    let lunarElevationTexture = null;
    function buildElevationDataTexture() {
      const W = ELEV_LON_STEPS, H = ELEV_LAT_STEPS;
      const stride = ELEV_LON_STEPS + 1;
      let src = new Float32Array(W * H);
      let dst = new Float32Array(W * H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          src[y * W + x] = lunarRadiusRatioGrid[y * stride + x];
        }
      }
      for (let pass = 0; pass < 3; pass++) {
        for (let y = 0; y < H; y++) {
          const ym = Math.max(0, y - 1), yp = Math.min(H - 1, y + 1);
          for (let x = 0; x < W; x++) {
            const xm = (x - 1 + W) % W, xp = (x + 1) % W;
            dst[y * W + x] = (
              src[y * W + x] * 4 +
              src[y * W + xm] * 2 + src[y * W + xp] * 2 +
              src[ym * W + x] * 2 + src[yp * W + x] * 2 +
              src[ym * W + xm] + src[ym * W + xp] + src[yp * W + xm] + src[yp * W + xp]
            ) / 16;
          }
        }
        const tmp = src; src = dst; dst = tmp;
      }
      const rgba = new Uint8Array(W * H * 4);
      for (let i = 0; i < W * H; i++) {
        const val = THREE.MathUtils.clamp(Math.round(((src[i] - 0.965) / 0.07) * 255), 0, 255);
        rgba[i * 4] = val;
        rgba[i * 4 + 1] = val;
        rgba[i * 4 + 2] = val;
        rgba[i * 4 + 3] = 255;
      }
      lunarElevationTexture = new THREE.DataTexture(rgba, W, H, THREE.RGBAFormat);
      lunarElevationTexture.wrapS = THREE.RepeatWrapping;
      lunarElevationTexture.wrapT = THREE.ClampToEdgeWrapping;
      lunarElevationTexture.minFilter = THREE.LinearFilter;
      lunarElevationTexture.magFilter = THREE.LinearFilter;
      lunarElevationTexture.needsUpdate = true;
    }

    function moonSurfaceHit(lat, lon) {
      const normal = latLonToUnitVector(lat, lon);
      const r = getSurfaceRadiusAt(lat, lon);
      return { position: normal.clone().multiplyScalar(r), normal, radius: r };
    }

    function measureMoonRadius() {
      const worldScale = moonMesh.scale.x;
      if (!moonModelRoot) return moonVisualRadius * worldScale;
      return (moonModelRoot.userData.trueLocalRadius || moonVisualRadius) * worldScale;
    }

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('./draco/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    // Yükleme göstergesi: köşede küçük, bitince kaybolur; hata olursa notu kalır.
    const modelStatus = document.getElementById('model-status');
    function showLoadProgress(adAnahtar, olay) {
      if (!modelStatus.isConnected || modelStatus.classList.contains('hata')) return;
      const ad = t(adAnahtar);
      modelStatus.textContent = olay.lengthComputable && olay.total > 0
        ? t('yukleme.yuzde', { ad, yuzde: Math.round((olay.loaded / olay.total) * 100) })
        : t('yukleme.mb', { ad, mb: (olay.loaded / 1e6).toFixed(1) });
    }
    function showLoadErrors(adAnahtarlari) {
      modelStatus.classList.add('hata');
      modelStatus.textContent = t('yukleme.hata', { ad: adAnahtarlari.map((a) => t(a)).join(', ') });
      modelStatus.addEventListener('click', () => modelStatus.remove(), { once: true });
    }

    function normalizeAndFitMoonModel(moonModel) {
      moonModel.traverse((node) => {
        node.position.set(0, 0, 0);
        node.rotation.set(0, 0, 0);
        node.quaternion.identity();
        node.scale.set(1, 1, 1);
      });
      moonModel.updateMatrixWorld(true);

      const v = new THREE.Vector3(), centroid = new THREE.Vector3();
      let count = 0;
      moonModel.traverse((node) => {
        if (!node.isMesh || !node.geometry?.attributes?.position) return;
        const pos = node.geometry.attributes.position;
        for (let i = 0; i < pos.count; i += 4) {
          v.fromBufferAttribute(pos, i).applyMatrix4(node.matrixWorld);
          centroid.add(v);
          count++;
        }
      });
      if (count > 0) centroid.divideScalar(count);
      moonModel.position.sub(centroid);
      moonModel.updateMatrixWorld(true);

      let radiusSum = 0, rCount = 0;
      moonModel.traverse((node) => {
        if (!node.isMesh || !node.geometry?.attributes?.position) return;
        const pos = node.geometry.attributes.position;
        for (let i = 0; i < pos.count; i += 4) {
          v.fromBufferAttribute(pos, i).applyMatrix4(node.matrixWorld);
          radiusSum += v.length();
          rCount++;
        }
      });
      const scale = moonVisualRadius / (rCount > 0 ? radiusSum / rCount : 1);
      moonModel.scale.multiplyScalar(scale);
      moonModel.position.multiplyScalar(scale);
      moonModel.updateMatrixWorld(true);
      moonModel.userData.trueLocalRadius = moonVisualRadius;
      moonModel.userData.isMoonModel = true;
      const maxAniso = renderer.capabilities.getMaxAnisotropy();
      moonModel.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = false;
          node.receiveShadow = false;
          if (node.material?.map) {
            node.material.map.anisotropy = maxAniso;
            node.material.map.needsUpdate = true;
          }
        }
      });
    }

    // Yer tutucu gök cisimleri: ilk karede hemen çizilir; GLB'ler inince yerlerine geçer (konum ve ölçek aynı gruplardadır).
    const placeholders = { moon: null, earth: null, sun: null };
    function disposeModel(kok) {
      kok.removeFromParent();
      kok.traverse((dugum) => {
        dugum.geometry?.dispose();
        const malzemeler = Array.isArray(dugum.material) ? dugum.material : dugum.material ? [dugum.material] : [];
        for (const malzeme of malzemeler) { malzeme.map?.dispose(); malzeme.dispose(); }
      });
    }
    {
      const moonGroup = new THREE.Group();
      moonGroup.add(new THREE.Mesh(
        new THREE.SphereGeometry(moonVisualRadius, 96, 64),
        new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.92, metalness: 0.04 })
      ));
      moonGroup.userData.trueLocalRadius = moonVisualRadius;
      moonGroup.userData.isMoonModel = true;
      moonMesh.add(moonGroup);
      moonModelRoot = moonGroup;
      placeholders.moon = moonGroup;

      placeholders.earth = new THREE.Mesh(
        new THREE.SphereGeometry(earthVisualDiameter * 0.5, 48, 32),
        new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.65, metalness: 0.1 })
      );
      earthModelGroup.add(placeholders.earth);

      placeholders.sun = new THREE.Mesh(
        new THREE.SphereGeometry(sunVisualDiameter * 0.5, 32, 24),
        new THREE.MeshBasicMaterial({ color: 0xfde047 })
      );
      sunModelGroup.add(placeholders.sun);
    }

    function applyMoonModel(model, detailed) {
      normalizeAndFitMoonModel(model);
      model.visible = isGlobeProjection();
      moonMesh.add(model);
      const previous = moonModelRoot;
      moonModelRoot = model;
      if (previous) disposeModel(previous);
      // Yükseklik ağı ve 2B harita dokusu yalnız ayrıntılı modelden çıkarılır; önizleme küre yarıçapıyla sınırlıdır.
      if (detailed) model.userData.trueLocalRadius = buildLunarSurfaceGrid(model);
      onMoonModelChanged();
      if (detailed) {
        update2DProjectionMapsTexture();
        recommendLandingSite(Number(slider.value), true);
      }
    }

    function applyEarthModel(earthModel) {
      const earthSize = new THREE.Box3().setFromObject(earthModel).getSize(new THREE.Vector3());
      const maxDim = Math.max(earthSize.x, earthSize.y, earthSize.z);
      if (maxDim > 0) earthModel.scale.setScalar(earthVisualDiameter / maxDim);
      earthModel.position.sub(new THREE.Box3().setFromObject(earthModel).getCenter(new THREE.Vector3()));
      earthModelGroup.add(earthModel);
      if (placeholders.earth) { disposeModel(placeholders.earth); placeholders.earth = null; }
    }

    function applySunModel(sunModel) {
      const sunSize = new THREE.Box3().setFromObject(sunModel).getSize(new THREE.Vector3());
      const maxDim = Math.max(sunSize.x, sunSize.y, sunSize.z);
      if (maxDim > 0) sunModel.scale.setScalar(sunVisualDiameter / maxDim);
      sunModel.position.sub(new THREE.Box3().setFromObject(sunModel).getCenter(new THREE.Vector3()));
      sunModel.traverse((node) => {
        if (node.isMesh) { node.castShadow = false; node.receiveShadow = false; }
      });
      sunModelGroup.add(sunModel);
      if (placeholders.sun) { disposeModel(placeholders.sun); placeholders.sun = null; }
    }

    // Sıra: önizleme Ay, ayrıntılı Ay, sonra Dünya ve Güneş birlikte. Bir dosya inmezse yer tutucu kalır, uyarı yazılır.
    async function loadModels() {
      const failed = [];
      const attempt = async (file, nameKey, apply) => {
        try {
          const gltf = await loader.loadAsync(`./${file}`, (olay) => showLoadProgress(nameKey, olay));
          apply(gltf.scene);
          return true;
        } catch (error) {
          console.warn(`${file} could not be loaded; the placeholder stays`, error);
          failed.push(nameKey);
          return false;
        }
      };
      const mark = (durum) => { document.documentElement.dataset.yukleme = durum; };
      if (await attempt('moon4-onizleme.glb', 'cisim.ay_onizleme', (model) => applyMoonModel(model, false))) mark('onizleme');
      if (await attempt('moon4.glb', 'cisim.ay', (model) => applyMoonModel(model, true))) mark('ayrintili');
      await Promise.all([
        attempt('earth1.glb', 'cisim.dunya', applyEarthModel),
        attempt('sun2.glb', 'cisim.gunes', applySunModel)
      ]);
      mark('tam');
      if (failed.length) showLoadErrors(failed);
      else modelStatus.remove();
    }

    const sunLight = new THREE.PointLight(0xfff5e0, 2.8, 0, 0);
    sunLight.position.copy(sunPosition);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0xdbeafe, 0.26));

    const recommendationMarkerGroup = new THREE.Group();
    moonMesh.add(recommendationMarkerGroup);
    let showRecommendationMarkers = false;
    let isFirstPersonView = false;

    function clearRecommendationMarkers() {
      for (const marker of [...recommendationMarkerGroup.children]) {
        marker.traverse((object) => {
          object.geometry?.dispose();
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          for (const material of materials) {
            material?.map?.dispose();
            material?.dispose();
          }
        });
        recommendationMarkerGroup.remove(marker);
      }
    }

    function renderRecommendationMarkers(recommendations) {
      clearRecommendationMarkers();
      recommendationMarkerGroup.visible = showRecommendationMarkers && !isFirstPersonView && isGlobeProjection();
      if (!recommendationMarkerGroup.visible) return;
      const colors = [0xffcc33, 0x38bdf8, 0xf472b6, 0x4ade80, 0xc084fc];
      recommendations.forEach((candidate, index) => {
        const surfaceHit = moonSurfaceHit(candidate.lat, candidate.lon);
        const normal = surfaceHit.normal;
        const marker = new THREE.Group();
        marker.position.copy(surfaceHit.position).addScaledVector(normal, moonSurfaceRadius * 0.006);
        marker.quaternion.setFromUnitVectors(UP_Y, normal);

        const color = colors[index % colors.length];
        marker.add(new THREE.Mesh(
          new THREE.SphereGeometry(moonSurfaceRadius * 0.012, 12, 12),
          new THREE.MeshBasicMaterial({ color, depthTest: true })
        ));

        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(64, 64, 56, 0, Math.PI * 2);
        ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;

        ctx.strokeStyle = '#ffffff';

        ctx.fillStyle = '#07111f';

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(index + 1), 64, 67);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true, depthWrite: false }));
        label.scale.set(moonSurfaceRadius * 0.075, moonSurfaceRadius * 0.075, 1);

        marker.add(label);
        recommendationMarkerGroup.add(marker);
      });

    let currentLandingLocal = new THREE.Vector3(0, -moonVisualRadius, 0);
    let currentLandingNormal = new THREE.Vector3(0, -1, 0);
    let landingFocusTarget = moonPosition.clone();
    let activeFocus = 'moon';

    function moonOverviewOffset() {
      const toEarth = earthPosition.clone().sub(moonPosition).normalize();
      const toSun = sunPosition.clone().sub(moonPosition).normalize();
      return toEarth.add(toSun).normalize().negate();
    }

    function updateLandingSite(lat, lon, preserveView = false) {
      const surfaceHit = moonSurfaceHit(lat, lon);
      currentLandingLocal.copy(surfaceHit.position);
      currentLandingNormal.copy(surfaceHit.normal);
      if (!preserveView) activeFocus = 'moon';

      const focusPos = surfaceHit.position.clone().applyAxisAngle(UP_Y, moonMesh.rotation.y);
      const focusNormal = surfaceHit.normal.clone().applyAxisAngle(UP_Y, moonMesh.rotation.y);
      landingFocusTarget.copy(moonMesh.position).add(focusPos).addScaledVector(focusNormal, -moonSurfaceRadius * 0.08);
      if (!preserveView) {
        camera.up.set(0, 1, 0);
        controls.target.copy(moonMesh.position);
        camera.position.copy(moonMesh.position).addScaledVector(moonOverviewOffset(), moonSurfaceRadius * 2.4);
        controls.update();
      }
    }

    function focusBody(body) {
      isFirstPersonView = false;
      camera.near = defaultCameraNear;
      camera.updateProjectionMatrix();
      camera.up.set(0, 1, 0);
      if (body !== 'moon' && currentProjectionId !== 'globe') switchProjection('globe');
      recommendationMarkerGroup.visible = showRecommendationMarkers && body === 'moon' && isGlobeProjection();
      const viewDirection = body === 'moon'
        ? moonOverviewOffset()
        : body === 'sun'
          ? new THREE.Vector3(-0.8, 0, 0.6).normalize()
          : camera.position.clone().sub(controls.target).normalize();
      let target = body === 'moon' ? moonMesh.position.clone() : landingFocusTarget;
      let distance = moonSurfaceRadius * 2.35;
      if (body === 'earth') {
        target = earthPosition;
        distance = earthVisualDiameter * 1.8;
      } else if (body === 'sun') {
        target = sunPosition;
        distance = sunVisualDiameter * 3.5;
      }
      activeFocus = body;
      setMapControlsVisible(body === 'moon');
      cameraFlight = {
        fromPosition: camera.position.clone(),
        fromTarget: controls.target.clone(),
        toTarget: target.clone(),
        toPosition: target.clone().addScaledVector(viewDirection, distance),
        startedAt: performance.now(),
        duration: 2000
      };
    }

    function goToLandingCandidate(candidate) {
      isFirstPersonView = false;
      if (!isGlobeProjection()) switchProjection('globe');
      recommendationMarkerGroup.visible = showRecommendationMarkers;
      flyToLatLon(candidate.lat, candidate.lon, candidate.name || t('js.aday_bolge'));

    function enterFirstPersonAtCandidate(candidate) {
      if (!isGlobeProjection()) switchProjection('globe');
      setGamepadActive(false);
      updateLandingSite(candidate.lat, candidate.lon, true);
      activeFocus = 'first-person';
      isFirstPersonView = true;
      camera.near = 0.00001;
      camera.updateProjectionMatrix();
      recommendationMarkerGroup.visible = false;
      cameraFlight = null;
      document.getElementById('body-focus').value = 'moon';

      const localPoint = currentLandingLocal.clone().applyAxisAngle(UP_Y, moonMesh.rotation.y);
      const surfaceNormal = currentLandingNormal.clone().applyAxisAngle(UP_Y, moonMesh.rotation.y).normalize();
      camera.up.copy(surfaceNormal);
      const cameraPosition = moonMesh.position.clone().add(localPoint).addScaledVector(surfaceNormal, moonSurfaceRadius * 0.00002);

      const toEarth = earthPosition.clone().sub(cameraPosition);
      let forward = toEarth.clone().addScaledVector(surfaceNormal, -toEarth.dot(surfaceNormal));
      if (forward.lengthSq() < 1e-4) {
        forward.set(0, 0, 1).addScaledVector(surfaceNormal, -surfaceNormal.z);
      }
      forward.normalize().addScaledVector(surfaceNormal, 0.08).normalize();
      camera.position.copy(cameraPosition);
      controls.target.copy(cameraPosition).addScaledVector(forward, moonSurfaceRadius * 0.03);
      camera.lookAt(controls.target);
      controls.update();

      const fpBtn = document.getElementById('sfd-fp-btn');
      if (fpBtn) fpBtn.textContent = t('ornek.fp_donus');
    }

    let graticuleBuiltRadius = 0;
    let graticuleBuiltStep = 15;
    let graticuleBuiltElevationState = false;
    const graticuleLabelSprites = [];
    const nomenclatureSprites = [];
    const labelTextures = new Map();
    const nomenclatureTextures = new Map();
    const graticuleUniforms = {
      uCamLocalDir: { value: new THREE.Vector3(0, 0, 1) },
      uHorizonCos: { value: 0.35 }
    };

    function createGraticuleLineMaterial(colorHex, opacity) {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthTest: false,
        depthWrite: false,
        uniforms: {
          uColor: { value: new THREE.Color(colorHex) },
          uOpacity: { value: opacity },
          uCamLocalDir: graticuleUniforms.uCamLocalDir,
          uHorizonCos: graticuleUniforms.uHorizonCos
        },
        vertexShader: `
          varying vec3 vLocalDir;
          void main() {
            vLocalDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          uniform vec3 uCamLocalDir;
          uniform float uHorizonCos;
          varying vec3 vLocalDir;
          void main() {
            if (dot(normalize(vLocalDir), uCamLocalDir) < uHorizonCos) discard;
            gl_FragColor = vec4(uColor, uOpacity);
          }
        `
      });
    }

    function getLabelTexture(text, isStrong = false) {
      const key = `${text}_${isStrong ? 1 : 0}`;
      let texture = labelTextures.get(key);
      if (texture) return texture;
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 96;
      const ctx = canvas.getContext('2d');
      ctx.font = '800 54px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(10, 5, 0, 0.96)';
      ctx.strokeText(text, 128, 48);
      ctx.fillStyle = isStrong ? '#ff9d3b' : '#ffd09e';
      ctx.fillText(text, 128, 48);
      texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      labelTextures.set(key, texture);
      return texture;
    }

    function getNomenclatureTexture(item) {
      const key = `${item.type}_${item.name}`;
      let tex = nomenclatureTextures.get(key);
      if (tex) return tex;
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const isLander = item.type === 'lander';
      const icon = isLander ? '✦ ' : '◎ ';
      const fullText = icon + item.name;
      ctx.font = '700 44px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const tw = Math.min(480, ctx.measureText(fullText).width + 44);
      const bx = (512 - tw) / 2, by = 22, bh = 84, br = 18;
      ctx.fillStyle = isLander ? 'rgba(8, 47, 73, 0.92)' : 'rgba(30, 27, 18, 0.90)';
      ctx.strokeStyle = isLander ? '#38bdf8' : '#fbbf24';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(bx, by, tw, bh, br);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = isLander ? '#e0f2fe' : '#fef3c7';
      ctx.fillText(fullText, 256, 65);
      tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      nomenclatureTextures.set(key, tex);
      return tex;
    }

    function rebuildNomenclature3D() {
      nomenclatureSprites.length = 0;
      for (const child of [...nomenclatureGroup.children]) {
        nomenclatureGroup.remove(child);
      }
      const radius = moonSurfaceRadius;
      for (const item of NOMENCLATURE_ITEMS) {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: getNomenclatureTexture(item),
          transparent: true,
          depthTest: false,
          depthWrite: false
        }));
        const pos = latLonToVector3(item.lat, item.lon, getSurfaceRadiusAt(item.lat, item.lon) * 1.012);
        sprite.position.copy(pos);
        sprite.userData.localNormal = pos.clone().normalize();
        sprite.userData.nomenclatureItem = item;
        sprite.scale.set(radius * 0.175, radius * 0.044, 1);
        sprite.renderOrder = 6;
        nomenclatureGroup.add(sprite);
        nomenclatureSprites.push(sprite);
      }
    }

    function computeIdealGraticuleStep() {
      const ratio = camera.position.distanceTo(moonMesh.position) / Math.max(moonSurfaceRadius, 1);
      if (ratio < 1.35) return 5;
      if (ratio < 1.95) return 10;
      return 15;
    }

    const formatLatLabel = (lat) => lat === 0 ? '0°' : `${Math.abs(lat)} ${lat > 0 ? 'N' : 'S'}`;
    const formatLonLabel = (lon) => (lon === 0 || Math.abs(lon) === 180) ? `${Math.abs(lon)}°` : `${Math.abs(lon)} ${lon > 0 ? 'E' : 'W'}`;

    function rebuildGraticule(stepDeg = graticuleBuiltStep) {
      const radius = moonSurfaceRadius;
      graticuleBuiltRadius = radius;
      graticuleBuiltStep = stepDeg;
      graticuleBuiltElevationState = hasElevationGrid;
      graticuleLabelSprites.length = 0;

      for (const child of [...graticuleGroup.children]) {
        graticuleGroup.remove(child);
        child.geometry?.dispose();
        if (child.material && !child.isSprite) child.material.dispose();
      }

      const normalMat = createGraticuleLineMaterial(GRATICULE_COLOR, 0.78);
      const strongMat = createGraticuleLineMaterial(GRATICULE_STRONG_COLOR, 0.98);
      const surfacePoint = (lat, lon, extraLift = 0) => latLonToVector3(lat, lon, getSurfaceRadiusAt(lat, lon) * (1 + GRATICULE_LIFT + extraLift));

      const addLine = (points, material, loop) => {
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = loop ? new THREE.LineLoop(geometry, material) : new THREE.Line(geometry, material);
        line.raycast = () => {};
        line.renderOrder = 4;
        graticuleGroup.add(line);
      };

      for (let lat = -90 + stepDeg; lat < 90; lat += stepDeg) {
        const points = [];
        for (let lon = -180; lon < 180; lon += 1) points.push(surfacePoint(lat, lon));
        addLine(points, lat === 0 ? strongMat : normalMat, true);
      }

      for (let lon = -180; lon < 180; lon += stepDeg) {
        const points = [];
        for (let lat = -90; lat <= 90; lat += 1) points.push(surfacePoint(lat, lon));
        addLine(points, (lon === 0 || Math.abs(lon) === 180) ? strongMat : normalMat, false);
      }

      const labelStep = stepDeg <= 5 ? 10 : stepDeg <= 10 ? 20 : 30;
      const addLabel = (text, lat, lon, isStrong = false) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: getLabelTexture(text, isStrong),
          transparent: true,
          depthTest: false,
          depthWrite: false
        }));
        const pos = surfacePoint(lat, lon, 0.006);
        sprite.position.copy(pos);
        sprite.userData.localNormal = pos.clone().normalize();
        sprite.scale.set(radius * 0.105, radius * 0.039, 1);
        sprite.raycast = () => {};
        sprite.renderOrder = 5;
        graticuleGroup.add(sprite);
        graticuleLabelSprites.push(sprite);
      };

      for (let lat = -90 + labelStep; lat <= 90 - labelStep; lat += labelStep) {
        if (lat === 0) continue;
        for (const lon of [-120, -60, 0, 60, 120, 180]) addLabel(formatLatLabel(lat), lat, lon, false);
      }
      addLabel('90 N', 89.2, 0, true);
      addLabel('90 S', -89.2, 0, true);
      for (let lon = -180 + labelStep; lon <= 180; lon += labelStep) {
        const isPrime = lon === 0 || Math.abs(lon) === 180;
        addLabel(formatLonLabel(lon), 0, lon, isPrime);
        if (Math.abs(lon) % 30 === 0) {
          addLabel(formatLonLabel(lon), 45, lon, isPrime);
          addLabel(formatLonLabel(lon), -45, lon, isPrime);
        }
      }

      rebuildNomenclature3D();
      goToMarkerGroup.scale.setScalar(radius * 0.014);
    }

    function syncGraticuleToMoon() {
      const currentRadius = measureMoonRadius();
      const idealStep = computeIdealGraticuleStep();
      const radiusChanged = Math.abs(currentRadius - graticuleBuiltRadius) / Math.max(graticuleBuiltRadius, 1e-6) > 0.0005;
      if (radiusChanged || idealStep !== graticuleBuiltStep || hasElevationGrid !== graticuleBuiltElevationState) {
        moonSurfaceRadius = currentRadius;
        rebuildGraticule(idealStep);
      }
      moonMesh.updateMatrixWorld(true);
      const camLocalVec = moonMesh.worldToLocal(camera.position.clone());
      const camLocalDist = Math.max(camLocalVec.length(), moonSurfaceRadius * 1.002);
      const camLocalDir = camLocalVec.clone().divideScalar(camLocalDist);
      const horizonCos = THREE.MathUtils.clamp((moonSurfaceRadius * 0.985) / camLocalDist, 0.02, 0.992);
      graticuleUniforms.uCamLocalDir.value.copy(camLocalDir);
      graticuleUniforms.uHorizonCos.value = horizonCos;

      const camDist = camera.position.distanceTo(moonMesh.position);
      const distFactor = THREE.MathUtils.clamp((camDist - moonSurfaceRadius * 0.85) / (moonSurfaceRadius * 1.5), 0.35, 1.25);

      if (graticuleGroup.visible && graticuleLabelSprites.length > 0) {
        const w = moonSurfaceRadius * 0.105 * distFactor;
        const h = moonSurfaceRadius * 0.039 * distFactor;
        for (const sprite of graticuleLabelSprites) {
          sprite.scale.set(w, h, 1);
          sprite.visible = sprite.userData.localNormal.dot(camLocalDir) > horizonCos + 0.04;
        }
      }

      if (nomenclatureGroup.visible && nomenclatureSprites.length > 0) {
        const nw = moonSurfaceRadius * 0.175 * distFactor;
        const nh = moonSurfaceRadius * 0.044 * distFactor;
        for (const sprite of nomenclatureSprites) {
          sprite.scale.set(nw, nh, 1);
          sprite.visible = sprite.userData.localNormal.dot(camLocalDir) > horizonCos + 0.04;
        }
      }
    }

    function onMoonModelChanged() {
      moonSurfaceRadius = measureMoonRadius();
      rebuildGraticule(computeIdealGraticuleStep());
    }

    const goToMarkerGroup = new THREE.Group();
    goToMarkerGroup.visible = false;
    const goToDot = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff8a1f }));
    const goToRing = new THREE.Mesh(new THREE.RingGeometry(1.3, 1.85, 32), new THREE.MeshBasicMaterial({ color: 0xffb36b, side: THREE.DoubleSide }));
    goToRing.rotation.x = -Math.PI / 2;
    goToRing.position.y = 0.15;
    goToMarkerGroup.add(goToDot, goToRing);
    goToMarkerGroup.traverse((obj) => { obj.raycast = () => {}; });
    moonMesh.add(goToMarkerGroup);

    onMoonModelChanged();

    let projectionPlaneMesh = null;
    function createProjectionShaderMaterial(mode) {
      return new THREE.ShaderMaterial({
        side: THREE.DoubleSide,
        transparent: mode !== 0,
        uniforms: {
          uMap: { value: moonTextureMap },
          uElevMap: { value: lunarElevationTexture },
          uHasMap: { value: Boolean(moonTextureMap) },
          uHasElev: { value: Boolean(lunarElevationTexture) },
          uMode: { value: mode }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform sampler2D uElevMap;
          uniform bool uHasMap;
          uniform bool uHasElev;
          uniform int uMode;
          varying vec2 vUv;

          void main() {
            float lat = 0.0;
            float lon = 0.0;
            float edgeAlpha = 1.0;

            if (uMode == 0) {
              lon = (vUv.x - 0.5) * 360.0;
              lat = (vUv.y - 0.5) * 180.0;
            } else {
              vec2 p = (vUv - 0.5) * 2.0;
              float r = length(p);
              if (r > 1.0) discard;
              edgeAlpha = 1.0 - smoothstep(0.992, 1.0, r);
              lat = (uMode == 1) ? (90.0 - r * 90.0) : (-90.0 + r * 90.0);
              lon = degrees(atan(p.y, p.x));
            }

            float u = fract((lon + 180.0) / 360.0);
            float vTex = clamp((90.0 - lat) / 180.0, 0.0005, 0.9995);
            float vElev = clamp((lat + 90.0) / 180.0, 0.002, 0.998);

            vec3 baseCol = vec3(0.42, 0.45, 0.50);
            if (uHasMap) {
              vec2 uvA = vec2(u, vTex);
              vec2 uvB = vec2(fract(u + 0.5), vTex);
              vec2 dx = min(abs(dFdx(uvA)), abs(dFdx(uvB)));
              vec2 dy = min(abs(dFdy(uvA)), abs(dFdy(uvB)));
              vec3 raw = textureGrad(uMap, uvA, dx, dy).rgb;
              vec3 d1 = textureGrad(uMap, vec2(fract(u + 0.00045), vTex), dx, dy).rgb;
              vec3 d2 = textureGrad(uMap, vec2(u, clamp(vTex + 0.00045, 0.0005, 0.9995)), dx, dy).rgb;
              float micro = dot(raw - 0.5 * (d1 + d2), vec3(0.333)) * 1.8;
              baseCol = pow(clamp(raw, 0.0, 1.0), vec3(1.45)) * 0.68 + micro;
            }

            float shade = 1.0;
            if (uHasElev) {
              float stepU = 0.0035;
              float stepV = 0.0035;
              float eE = texture2D(uElevMap, vec2(fract(u + stepU), vElev)).r;
              float eW = texture2D(uElevMap, vec2(fract(u - stepU), vElev)).r;
              float eN = texture2D(uElevMap, vec2(u, clamp(vElev + stepV, 0.002, 0.998))).r;
              float eS = texture2D(uElevMap, vec2(u, clamp(vElev - stepV, 0.002, 0.998))).r;
              float slope = (eW - eE) * 1.35 + (eN - eS) * 1.15;
              shade = clamp(0.96 + slope, 0.62, 1.26);
            }

            vec3 finalCol = clamp(baseCol * shade, 0.04, 0.88);
            gl_FragColor = vec4(finalCol, edgeAlpha);
          }
        `
      });
    }

    function create2DProjectionView(projId) {
      for (const child of [...projectionMapGroup.children]) {
        projectionMapGroup.remove(child);
        child.traverse((n) => {
          n.geometry?.dispose();
          if (n.material && !n.isSprite) n.material.dispose();
        });
      }
      const r = moonSurfaceRadius;
      const lineMat = new THREE.LineBasicMaterial({ color: GRATICULE_COLOR, transparent: true, opacity: 0.78, depthTest: false });
      const strongMat = new THREE.LineBasicMaterial({ color: GRATICULE_STRONG_COLOR, transparent: true, opacity: 0.98, depthTest: false });

      const add2DGraticuleLabel = (text, x, y, isStrong = false) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: getLabelTexture(text, isStrong),
          transparent: true,
          depthTest: false,
          depthWrite: false
        }));
        sprite.position.set(x, y, 0.12);
        sprite.scale.set(r * 0.21, r * 0.078, 1);
        sprite.userData.layerType = 'graticule';
        sprite.raycast = () => {};
        sprite.renderOrder = 5;
        projectionMapGroup.add(sprite);
      };

      const add2DNomenclatureLabel = (item, x, y) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: getNomenclatureTexture(item),
          transparent: true,
          depthTest: false,
          depthWrite: false
        }));
        sprite.position.set(x, y, 0.18);
        sprite.scale.set(r * 0.32, r * 0.08, 1);
        sprite.userData.layerType = 'nomenclature';
        sprite.userData.nomenclatureItem = item;
        sprite.renderOrder = 6;
        projectionMapGroup.add(sprite);
      };

      if (projId === 'global') {
        const width = r * 3.2, height = r * 1.6;
        projectionPlaneMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(width, height, 4, 4),
          createProjectionShaderMaterial(0)
        );
        projectionPlaneMesh.userData = { projectionType: 'global', mapWidth: width, mapHeight: height };
        projectionMapGroup.add(projectionPlaneMesh);

        for (let lat = -75; lat <= 75; lat += 15) {
          const y = (lat / 90) * (height / 2);
          const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-width / 2, y, 0.05), new THREE.Vector3(width / 2, y, 0.05)]), lat === 0 ? strongMat : lineMat);
          line.userData.layerType = 'graticule';
          line.raycast = () => {};
          projectionMapGroup.add(line);
          if (lat % 30 === 0 && lat !== 0) {
            add2DGraticuleLabel(formatLatLabel(lat), -width * 0.46, y, false);
            add2DGraticuleLabel(formatLatLabel(lat), width * 0.46, y, false);
          }
        }
        for (let lon = -180; lon <= 180; lon += 15) {
          const x = (lon / 180) * (width / 2);
          const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, -height / 2, 0.05), new THREE.Vector3(x, height / 2, 0.05)]), lon === 0 ? strongMat : lineMat);
          line.userData.layerType = 'graticule';
          line.raycast = () => {};
          projectionMapGroup.add(line);
          if (lon % 30 === 0 && Math.abs(lon) < 180) {
            add2DGraticuleLabel(formatLonLabel(lon), x, 0, lon === 0);
          }
        }
        for (const item of NOMENCLATURE_ITEMS) {
          const x = (item.lon / 180) * (width / 2);
          const y = (item.lat / 90) * (height / 2);
          add2DNomenclatureLabel(item, x, y);
        }
      } else {
        const isNorth = projId === 'north-pole';
        const discRadius = r * 1.35;
        projectionPlaneMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(discRadius * 2, discRadius * 2, 4, 4),
          createProjectionShaderMaterial(isNorth ? 1 : 2)
        );
        projectionPlaneMesh.userData = { projectionType: projId, discRadius };
        projectionMapGroup.add(projectionPlaneMesh);

        for (let step = 15; step <= 90; step += 15) {
          const ringR = (step / 90) * discRadius, pts = [];
          for (let a = 0; a < 360; a += 2) {
            const rad = THREE.MathUtils.degToRad(a);
            pts.push(new THREE.Vector3(Math.cos(rad) * ringR, Math.sin(rad) * ringR, 0.05));
          }
          const loop = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), step === 90 ? strongMat : lineMat);
          loop.userData.layerType = 'graticule';
          loop.raycast = () => {};
          projectionMapGroup.add(loop);
          if (step % 30 === 0 && step < 90) {
            const latVal = isNorth ? (90 - step) : (-90 + step);
            add2DGraticuleLabel(formatLatLabel(latVal), 0, ringR, false);
          }
        }
        for (let lon = -180; lon < 180; lon += 15) {
          const rad = THREE.MathUtils.degToRad(lon);
          const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0.05), new THREE.Vector3(Math.cos(rad) * discRadius, Math.sin(rad) * discRadius, 0.05)]), (lon === 0 || Math.abs(lon) === 180) ? strongMat : lineMat);
          line.userData.layerType = 'graticule';
          line.raycast = () => {};
          projectionMapGroup.add(line);
          if (lon % 30 === 0) {
            const labelR = discRadius * 1.07;
            add2DGraticuleLabel(formatLonLabel(lon), Math.cos(rad) * labelR, Math.sin(rad) * labelR, lon === 0 || Math.abs(lon) === 180);
          }
        }
        for (const item of NOMENCLATURE_ITEMS) {
          if (isNorth && item.lat < 0) continue;
          if (!isNorth && item.lat > 0) continue;
          const distRatio = isNorth ? ((90 - item.lat) / 90) : ((item.lat + 90) / 90);
          const rad = THREE.MathUtils.degToRad(item.lon);
          const rr = distRatio * discRadius;
          add2DNomenclatureLabel(item, Math.cos(rad) * rr, Math.sin(rad) * rr);
        }
      }
    }

    function update2DProjectionMapsTexture() {
      if (!isGlobeProjection()) create2DProjectionView(currentProjectionId);
    }

    const freeLocal = new THREE.Vector3();
    const mapFocusLocal = new THREE.Vector3();
    function resolveFocusTarget() {
      if (activeFocus === 'sun') return sunPosition;
      if (activeFocus === 'earth') return earthPosition;
      if (activeFocus === 'map' && !isGlobeProjection()) {
        moonMesh.updateMatrixWorld(true);
        projectionMapGroup.updateMatrixWorld(true);
        return projectionMapGroup.localToWorld(mapFocusLocal.clone());
      }
      if (activeFocus === 'free' && isGlobeProjection()) {
        moonMesh.updateMatrixWorld(true);
        return moonMesh.localToWorld(freeLocal.clone());
      }
      return moonMesh.position;
    }

    const mapControlsEl = document.getElementById('map-controls');
    const mapPanel = document.getElementById('map-panel');
    const mapOpenBtn = document.getElementById('map-open');
    const mapList = document.getElementById('map-list');
    const gamepadBtn = document.getElementById('map-gamepad');
    const gamepadHint = document.getElementById('gamepad-hint');
    const graticuleToggle = document.getElementById('graticule-toggle');
    const nomenclatureToggle = document.getElementById('nomenclature-toggle');
    const readout = document.getElementById('coord-readout');
    const setMapStatus = (text) => { document.getElementById('map-status').textContent = text; };

    function setMapControlsVisible(visible) {
      mapControlsEl.hidden = !visible;
      if (!visible) {
        closeMapPanel();
        setGamepadActive(false);
        readout.hidden = true;
      }
    }

    function closeMapPanel() {
      mapPanel.hidden = true;
      mapOpenBtn.setAttribute('aria-expanded', 'false');
    }

    function applyProjectionState() {
      const globe = isGlobeProjection();
      if (moonModelRoot) moonModelRoot.visible = globe;
      earthModelGroup.visible = globe;
      sunModelGroup.visible = globe;
      earthOrbitLine.visible = globe;
      moonOrbitLine.visible = globe;
      projectionMapGroup.visible = !globe;
      graticuleGroup.visible = graticuleToggle.checked && globe;
      nomenclatureGroup.visible = nomenclatureToggle.checked && globe;
      recommendationMarkerGroup.visible = showRecommendationMarkers && globe && !isFirstPersonView;
      for (const child of projectionMapGroup.children) {
        if (child === projectionPlaneMesh) continue;
        if (child.userData.layerType === 'nomenclature') {
          child.visible = nomenclatureToggle.checked;
        } else {
          child.visible = graticuleToggle.checked;
        }
      }
      gamepadBtn.disabled = !globe;
      gamepadBtn.title = t(globe ? 'harita.klavye_acik' : 'harita.klavye_kapali');
      if (!globe) setGamepadActive(false);
    }

    function switchProjection(id) {
      const entry = PROJECTIONS.find((item) => item.id === id);
      if (!entry) return;
      isFirstPersonView = false;
      activeFocus = 'moon';
      camera.near = defaultCameraNear;
      camera.updateProjectionMatrix();
      currentProjectionId = id;
      const radio = mapList.querySelector(`input[value="${id}"]`);
      if (radio) radio.checked = true;

      camera.up.set(0, 1, 0);
      if (entry.globe) {
        controls.enableRotate = true;
        applyProjectionState();
        onMoonModelChanged();
        setMapStatus(t('harita.globe_aktif'));
        cameraFlight = {
          fromPosition: camera.position.clone(),
          fromTarget: controls.target.clone(),
          toTarget: moonMesh.position.clone(),
          toPosition: moonMesh.position.clone().addScaledVector(moonOverviewOffset(), moonSurfaceRadius * 2.35),
          startedAt: performance.now(),
          duration: 1200
        };
      } else {
        create2DProjectionView(id);
        applyProjectionState();
        controls.enableRotate = false;
        setMapStatus(t('harita.gorunum_aktif', { ad: entry.label }));
        projectionMapGroup.quaternion.copy(moonMesh.quaternion).invert();
        cameraFlight = {
          fromPosition: camera.position.clone(),
          fromTarget: controls.target.clone(),
          toTarget: moonMesh.position.clone(),
          toPosition: moonMesh.position.clone().add(new THREE.Vector3(0, 0, moonSurfaceRadius * 2.6)),
          startedAt: performance.now(),
          duration: 1000
        };
      }
    }

    mapOpenBtn.addEventListener('click', () => {
      const willOpen = mapPanel.hidden;
      mapPanel.hidden = !willOpen;
      mapOpenBtn.setAttribute('aria-expanded', String(willOpen));
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !mapPanel.hidden) { closeMapPanel(); mapOpenBtn.focus(); }
    });
    document.addEventListener('pointerdown', (event) => {
      if (!mapPanel.hidden && !mapControlsEl.contains(event.target)) closeMapPanel();
    });
    graticuleToggle.addEventListener('change', applyProjectionState);
    nomenclatureToggle.addEventListener('change', applyProjectionState);

    for (const entry of PROJECTIONS) {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'moon-projection';
      input.value = entry.id;
      input.checked = entry.id === currentProjectionId;
      input.addEventListener('change', () => switchProjection(entry.id));
      const text = document.createElement('span');
      text.textContent = entry.label;
      label.append(input, text);
      mapList.appendChild(label);
    }

    function zoomMap(factor) {
      const target = controls.target.clone();
      const offset = camera.position.clone().sub(target);
      const at = (f) => target.clone().addScaledVector(offset, f);
      let f = THREE.MathUtils.clamp(offset.length() * factor, controls.minDistance, controls.maxDistance) / Math.max(offset.length(), 1e-5);
      if (f < 1 && isGlobeProjection()) {
        const minDistance = moonSurfaceRadius * 1.03;
        if (at(f).distanceTo(moonMesh.position) < minDistance) {
          let low = f, high = 1;
          for (let i = 0; i < 14; i++) {
            const mid = (low + high) / 2;
            if (at(mid).distanceTo(moonMesh.position) < minDistance) low = mid; else high = mid;
          }
          f = high;
        }
      }
      cameraFlight = { fromPosition: camera.position.clone(), fromTarget: target.clone(), toTarget: target.clone(), toPosition: at(f), startedAt: performance.now(), duration: 320 };
    }
    document.getElementById('map-zoom-in').addEventListener('click', () => zoomMap(0.72));
    document.getElementById('map-zoom-out').addEventListener('click', () => zoomMap(1.38));

    const gotoDialog = document.getElementById('goto-dialog');
    const gotoPlace = document.getElementById('goto-place');
    const gotoLat = document.getElementById('goto-lat');
    const gotoLon = document.getElementById('goto-lon');
    const gotoHint = document.getElementById('goto-hint');

    for (const group of [...new Set(LUNAR_PLACES.map((p) => p.group))]) {
      const optgroup = document.createElement('optgroup');
      optgroup.label = group;
      LUNAR_PLACES.forEach((place, index) => {
        if (place.group !== group) return;
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = `${place.name} (${place.lat.toFixed(2)}°, ${place.lon.toFixed(2)}°)`;
        optgroup.appendChild(option);
      });
      gotoPlace.appendChild(optgroup);
    }

    gotoPlace.addEventListener('change', () => {
      const place = LUNAR_PLACES[Number(gotoPlace.value)];
      if (!place) return;
      gotoLat.value = place.lat;
      gotoLon.value = place.lon;
      gotoHint.textContent = `${place.name} — ${konumMetni(place.lat, place.lon)}${place.desc ? ' • ' + place.desc : ''}`;
    });

    [gotoLat, gotoLon].forEach((input) => input.addEventListener('input', () => {
      gotoPlace.value = '';
      const lat = Number(gotoLat.value), lon = Number(gotoLon.value);
      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        gotoHint.textContent = t('goto.secilen', { k: konumMetni(lat, lon) });
      }
    }));

    document.getElementById('map-fly').addEventListener('click', () => { closeMapPanel(); gotoDialog.showModal(); });
    document.getElementById('goto-cancel').addEventListener('click', () => gotoDialog.close());
    document.getElementById('goto-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const lat = Number(gotoLat.value);
      const lon = ((Number(gotoLon.value) + 180) % 360 + 360) % 360 - 180;
      if (!Number.isFinite(lat) || lat < -90 || lat > 90 || !Number.isFinite(lon)) return;
      const selectedPlace = gotoPlace.value !== '' ? LUNAR_PLACES[Number(gotoPlace.value)] : null;
      gotoDialog.close();
      flyToLatLon(lat, lon, selectedPlace?.name);
    });

    function getLocalSurfaceRadiusAtWorldPos(worldCamPos) {
      moonMesh.updateMatrixWorld(true);
      const localCam = moonMesh.worldToLocal(worldCamPos.clone());
      const { lat, lon } = localVectorToLatLon(localCam);
      return getSurfaceRadiusAt(lat, lon);
    }

    function getMinMoonCameraDistance(worldCamPos) {
      return getLocalSurfaceRadiusAtWorldPos(worldCamPos) + moonSurfaceRadius * (isFirstPersonView ? 0.00001 : 0.014);
    }

    function enforceMoonSurfaceCollision() {
      if (!isGlobeProjection() || (activeFocus !== 'moon' && activeFocus !== 'free' && activeFocus !== 'first-person')) return;
      const center = moonMesh.position;
      const offset = camera.position.clone().sub(center);
      const dist = offset.length();
      const minDist = getMinMoonCameraDistance(camera.position);
      if (dist < minDist) {
        if (dist < 1e-5) offset.set(0, 0, 1);
        camera.position.copy(center).addScaledVector(offset.normalize(), minDist);
      }
    }

    function flyToLatLon(lat, lon, placeName = '', distanceMultiplier = 1.24) {
      isFirstPersonView = false;
      camera.near = defaultCameraNear;
      camera.updateProjectionMatrix();
      document.getElementById('body-focus').value = 'moon';
      setMapControlsVisible(true);

      if (!isGlobeProjection() && projectionPlaneMesh) {
        const projectionType = projectionPlaneMesh.userData.projectionType;
        let mapPoint;
        if (projectionType === 'global') {
          const { mapWidth, mapHeight } = projectionPlaneMesh.userData;
          mapPoint = new THREE.Vector3((lon / 180) * (mapWidth / 2), (lat / 90) * (mapHeight / 2), 0.18);
        } else {
          const isNorth = projectionType === 'north-pole';
          const radialFraction = isNorth ? (90 - lat) / 90 : (lat + 90) / 90;
          const radialDistance = radialFraction * projectionPlaneMesh.userData.discRadius;
          const angle = THREE.MathUtils.degToRad(lon);
          mapPoint = new THREE.Vector3(Math.cos(angle) * radialDistance, Math.sin(angle) * radialDistance, 0.18);
        }

        mapFocusLocal.copy(mapPoint);
        moonMesh.updateMatrixWorld(true);
        projectionMapGroup.updateMatrixWorld(true);
        const target = projectionMapGroup.localToWorld(mapPoint.clone());
        const mapNormal = new THREE.Vector3(0, 0, 1).transformDirection(projectionMapGroup.matrixWorld).normalize();
        if (camera.position.clone().sub(target).dot(mapNormal) < 0) mapNormal.negate();
        camera.up.copy(new THREE.Vector3(0, 1, 0).transformDirection(projectionMapGroup.matrixWorld).normalize());
        activeFocus = 'map';
        cameraFlight = {
          fromPosition: camera.position.clone(),
          fromTarget: controls.target.clone(),
          toTarget: target,
          toPosition: target.clone().addScaledVector(mapNormal, moonSurfaceRadius * 0.72),
          startedAt: performance.now(),
          duration: 900
        };
        setMapStatus(t('harita.bolge_yaklasiyor'));
        return;
      }

      if (!isGlobeProjection()) switchProjection('globe');

      const surfaceHit = moonSurfaceHit(lat, lon);
      const localPos = surfaceHit.position;
      const localNormal = surfaceHit.normal;
      activeFocus = 'moon';

      goToMarkerGroup.position.copy(localPos).addScaledVector(localNormal, moonSurfaceRadius * 0.004);
      goToMarkerGroup.quaternion.setFromUnitVectors(UP_Y, localNormal);
      goToMarkerGroup.scale.setScalar(moonSurfaceRadius * 0.014);
      goToMarkerGroup.visible = true;

      moonMesh.updateMatrixWorld(true);
      const worldNormal = localNormal.clone().transformDirection(moonMesh.matrixWorld).normalize();

      let tangent = new THREE.Vector3().crossVectors(UP_Y, worldNormal);
      if (tangent.lengthSq() < 1e-4) tangent.set(1, 0, 0);
      tangent.normalize();
      camera.up.copy(new THREE.Vector3().crossVectors(worldNormal, tangent).normalize());

      const toPosition = moonMesh.position.clone().addScaledVector(worldNormal, moonSurfaceRadius * distanceMultiplier);

      cameraFlight = {
        fromPosition: camera.position.clone(),
        fromTarget: controls.target.clone(),
        toTarget: moonMesh.position.clone(),
        toPosition,
        startedAt: performance.now(),
        duration: 1700
      };
      const labelStr = konumMetni(lat, lon);
      setMapStatus(placeName ? t('harita.yakinlasiyor', { ad: placeName, k: labelStr }) : t('harita.uculuyor', { k: labelStr }));
    }

    const hoverRaycaster = new THREE.Raycaster();
    const hoverPointer = new THREE.Vector2();
    const hoverSphere = new THREE.Sphere();
    const hoverHit = new THREE.Vector3();
    let hoverEvent = null, hoverFrame = 0;

    function findNearestLunarPlace(lat, lon, maxDeg = 2.6) {
      let best = null, bestAngDeg = maxDeg;
      const u1 = latLonToUnitVector(lat, lon);
      for (const item of NOMENCLATURE_ITEMS) {
        const u2 = latLonToUnitVector(item.lat, item.lon);
        const angDeg = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(u1.dot(u2), -1, 1)));
        if (angDeg < bestAngDeg) { bestAngDeg = angDeg; best = item; }
      }
      for (const place of LUNAR_PLACES) {
        const u2 = latLonToUnitVector(place.lat, place.lon);
        const angDeg = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(u1.dot(u2), -1, 1)));
        if (angDeg < bestAngDeg) { bestAngDeg = angDeg; best = place; }
      }
      return best;
    }

    function pickNomenclatureSprite(rc) {
      if (isGlobeProjection()) {
        if (!nomenclatureGroup.visible) return null;
        const visibleSprites = nomenclatureSprites.filter((s) => s.visible);
        const hits = rc.intersectObjects(visibleSprites, false);
        return hits[0]?.object?.userData?.nomenclatureItem || null;
      }
      if (!nomenclatureToggle.checked) return null;
      const mapSprites = projectionMapGroup.children.filter((c) => c.visible && c.userData?.nomenclatureItem);
      const hits = rc.intersectObjects(mapSprites, false);
      return hits[0]?.object?.userData?.nomenclatureItem || null;
    }

    function updateHoverReadout() {
      hoverFrame = 0;
      const event = hoverEvent;
      if (!event || event.buttons || (activeFocus !== 'moon' && activeFocus !== 'free')) {
        readout.hidden = true;
        renderer.domElement.style.cursor = '';
        return;
      }
      const rect = renderer.domElement.getBoundingClientRect();
      hoverPointer.set(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
      hoverRaycaster.setFromCamera(hoverPointer, camera);

      const spriteItem = pickNomenclatureSprite(hoverRaycaster);

      let lat = null, lon = null;
      if (isGlobeProjection()) {
        moonMesh.updateMatrixWorld(true);
        hoverSphere.set(moonMesh.position, moonSurfaceRadius);
        if (hoverRaycaster.ray.intersectSphere(hoverSphere, hoverHit)) {
          const coords = localVectorToLatLon(moonMesh.worldToLocal(hoverHit.clone()));
          lat = coords.lat;
          lon = coords.lon;
        } else if (spriteItem) {
          lat = spriteItem.lat;
          lon = spriteItem.lon;
        }
      } else if (projectionPlaneMesh) {
        const hits = hoverRaycaster.intersectObject(projectionPlaneMesh, false);
        if (hits.length) {
          const localPt = projectionPlaneMesh.worldToLocal(hits[0].point.clone());
          const pType = projectionPlaneMesh.userData.projectionType;
          if (pType === 'global') {
            lon = (localPt.x / (projectionPlaneMesh.userData.mapWidth / 2)) * 180;
            lat = (localPt.y / (projectionPlaneMesh.userData.mapHeight / 2)) * 90;
          } else {
            const distRatio = Math.hypot(localPt.x, localPt.y) / projectionPlaneMesh.userData.discRadius;
            if (distRatio <= 1) {
              lat = pType === 'north-pole' ? (90 - distRatio * 90) : (-90 + distRatio * 90);
              lon = THREE.MathUtils.radToDeg(Math.atan2(localPt.y, localPt.x));
            }
          }
        } else if (spriteItem) {
          lat = spriteItem.lat;
          lon = spriteItem.lon;
        }
      }
      if (lat === null || lon === null) {
        readout.hidden = true;
        renderer.domElement.style.cursor = '';
        return;
      }
      const nearPlace = spriteItem || findNearestLunarPlace(lat, lon);
      renderer.domElement.style.cursor = nearPlace ? 'pointer' : '';
      const coordText = t('okuma.koordinat', { lat: `${Math.abs(lat).toFixed(2)}° ${latDir(lat)}`, lon: `${Math.abs(lon).toFixed(2)}° ${lonDir(lon)}` });
      readout.textContent = nearPlace ? t('okuma.yakinlas', { k: coordText, ad: nearPlace.name }) : coordText;
      readout.hidden = false;
    }

            let lat = null, lon = null;
            if (pType === 'global') {
              lon = (localPt.x / (projectionPlaneMesh.userData.mapWidth / 2)) * 180;
              lat = (localPt.y / (projectionPlaneMesh.userData.mapHeight / 2)) * 90;
            } else {
              const distRatio = Math.hypot(localPt.x, localPt.y) / projectionPlaneMesh.userData.discRadius;
              if (distRatio <= 1) {
                lat = pType === 'north-pole' ? (90 - distRatio * 90) : (-90 + distRatio * 90);
                lon = THREE.MathUtils.radToDeg(Math.atan2(localPt.y, localPt.x));
              }

      const hit = raycaster.intersectObjects(scene.children, true).find((item) => item.object.isMesh);

        document.getElementById('body-focus').value = object.userData.focusBody;
        focusBody(object.userData.focusBody);
