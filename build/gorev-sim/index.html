    });

    const GAMEPAD_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'q', 'e', 'z', 'c', 'r', 'f']);
    const heldKeys = new Set();
    let gamepadActive = false, gamepadFrame = 0, gamepadLast = 0;
    let gamepadPitch = 0;
    const gamepadHeading = new THREE.Vector3(0, 1, 0);

    function applyGamepadCameraPose() {
      const center = moonMesh.position;
      const radialUnit = camera.position.clone().sub(center);
      if (radialUnit.lengthSq() < 1e-6) radialUnit.set(0, 0, 1);
      radialUnit.normalize();
      gamepadHeading.addScaledVector(radialUnit, -gamepadHeading.dot(radialUnit));
      if (gamepadHeading.lengthSq() < 1e-6) {
        gamepadHeading.set(0, 1, 0).addScaledVector(radialUnit, -radialUnit.y);
        if (gamepadHeading.lengthSq() < 1e-6) gamepadHeading.set(1, 0, 0);
      }
      gamepadHeading.normalize();

      const cosP = Math.cos(gamepadPitch), sinP = Math.sin(gamepadPitch);
      const lookDir = radialUnit.clone().multiplyScalar(-cosP).addScaledVector(gamepadHeading, sinP).normalize();
      camera.up.copy(gamepadHeading).multiplyScalar(cosP).addScaledVector(radialUnit, sinP).normalize();
      controls.target.copy(camera.position).addScaledVector(lookDir, moonSurfaceRadius);
      camera.lookAt(controls.target);
    }

    function setGamepadActive(on) {
      const nextState = Boolean(on && isGlobeProjection());
      if (nextState && !gamepadActive) {
        const center = moonMesh.position;
        const radialUnit = camera.position.clone().sub(center).normalize();
        camera.updateMatrixWorld();
        const camUp = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
        const camForward = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 2).negate();
        const tangentFwd = camForward.clone().addScaledVector(radialUnit, -camForward.dot(radialUnit));
        const tangentUp = camUp.clone().addScaledVector(radialUnit, -camUp.dot(radialUnit));
        gamepadHeading.copy(tangentFwd.lengthSq() > 1e-4 ? tangentFwd : tangentUp);
        if (gamepadHeading.lengthSq() < 1e-6) gamepadHeading.set(0, 1, 0).addScaledVector(radialUnit, -radialUnit.y);
        gamepadHeading.normalize();
        gamepadPitch = THREE.MathUtils.clamp(Math.acos(THREE.MathUtils.clamp(-camForward.dot(radialUnit), -1, 1)), 0, 1.48);
        applyGamepadCameraPose();
      } else if (!nextState && gamepadActive) {
        gamepadPitch = 0;
        if (isGlobeProjection()) {
          controls.target.copy(moonMesh.position);
          camera.up.set(0, 1, 0);
          camera.lookAt(controls.target);
        }
      }
      gamepadActive = nextState;
      gamepadBtn.setAttribute('aria-pressed', String(gamepadActive));
      gamepadHint.hidden = !gamepadActive;
      if (!gamepadActive) { heldKeys.clear(); gamepadLast = 0; }
    }
    gamepadBtn.addEventListener('click', () => { if (isGlobeProjection()) setGamepadActive(!gamepadActive); });

    function keyboardBusy() {
      const el = document.activeElement;
      const typing = el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && !['range', 'checkbox', 'radio', 'button'].includes(el.type)));
      return Boolean(typing || document.querySelector('dialog[open]'));
    }

    window.addEventListener('keydown', (event) => {
      if (!gamepadActive || !isGlobeProjection() || event.ctrlKey || event.metaKey || event.altKey || keyboardBusy()) return;
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (!GAMEPAD_KEYS.has(key)) return;
      event.preventDefault();
      heldKeys.add(key);
      if (!gamepadFrame) gamepadFrame = requestAnimationFrame(gamepadStep);
    });
    window.addEventListener('keyup', (event) => { heldKeys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key); });
    window.addEventListener('blur', () => heldKeys.clear());

    function gamepadStep(now) {
      gamepadFrame = 0;
      if (!gamepadActive || !heldKeys.size || !isGlobeProjection()) { gamepadLast = 0; return; }
      const dt = gamepadLast ? Math.min(0.05, (now - gamepadLast) / 1000) : 0.016;
      gamepadLast = now;
      cameraFlight = null;
      isFirstPersonView = false;
      camera.near = defaultCameraNear;
      camera.updateProjectionMatrix();

      const center = moonMesh.position, radius = moonSurfaceRadius;
      const prevSurfaceR = getLocalSurfaceRadiusAtWorldPos(camera.position);
      const minClearance = radius * 0.014;
      const prevAltitude = Math.max(camera.position.distanceTo(center) - prevSurfaceR, minClearance);
      const angularRate = THREE.MathUtils.clamp(0.32 + 0.65 * (prevAltitude / radius), 0.14, 1.05) * dt;

      const radialInit = camera.position.clone().sub(center).normalize();
      gamepadHeading.addScaledVector(radialInit, -gamepadHeading.dot(radialInit));
      if (gamepadHeading.lengthSq() < 1e-6) gamepadHeading.set(0, 1, 0).addScaledVector(radialInit, -radialInit.y);
      gamepadHeading.normalize();
      const rightTangent = new THREE.Vector3().crossVectors(gamepadHeading, radialInit).normalize();

      const rotateAroundMoon = (axis, angle) => {
        camera.position.sub(center).applyAxisAngle(axis, angle).add(center);
        gamepadHeading.applyAxisAngle(axis, angle).normalize();
      };

      const moveForward = (heldKeys.has('ArrowUp') || heldKeys.has('w') ? 1 : 0) - (heldKeys.has('ArrowDown') || heldKeys.has('s') ? 1 : 0);
      const moveRight = (heldKeys.has('ArrowRight') || heldKeys.has('d') ? 1 : 0) - (heldKeys.has('ArrowLeft') || heldKeys.has('a') ? 1 : 0);

      if (moveForward !== 0) rotateAroundMoon(rightTangent, -moveForward * angularRate);
      if (moveRight !== 0) rotateAroundMoon(gamepadHeading, moveRight * angularRate);

      const verticalDir = (heldKeys.has('q') ? 1 : 0) - (heldKeys.has('e') ? 1 : 0);
      const newSurfaceR = getLocalSurfaceRadiusAtWorldPos(camera.position);
      const nextAltitude = verticalDir !== 0
        ? THREE.MathUtils.clamp(prevAltitude * Math.exp(1.15 * dt * verticalDir), minClearance, controls.maxDistance)
        : prevAltitude;

      const radial = camera.position.clone().sub(center);
      if (radial.lengthSq() < 1e-6) radial.set(0, 0, 1);
      camera.position.copy(center).addScaledVector(radial.normalize(), newSurfaceR + nextAltitude);

      const spinDir = (heldKeys.has('z') ? 1 : 0) - (heldKeys.has('c') ? 1 : 0);
      if (spinDir !== 0) {
        const spinAxis = camera.position.clone().sub(center).normalize();
        const spinAngle = -spinDir * 1.25 * dt;
        gamepadHeading.applyAxisAngle(spinAxis, spinAngle).normalize();
      }

      const pitchDir = (heldKeys.has('r') ? 1 : 0) - (heldKeys.has('f') ? 1 : 0);
      if (pitchDir !== 0) {
        gamepadPitch = THREE.MathUtils.clamp(gamepadPitch + pitchDir * 1.15 * dt, 0, 1.48);
      }

      applyGamepadCameraPose();
      activeFocus = 'moon';
      gamepadFrame = requestAnimationFrame(gamepadStep);
    }

    function showLunarFeatureInfo(item) {
      const sampleFlight = SAMPLE_FLIGHTS.find((flight) => angleBetweenSitesDeg(item.lat, item.lon, flight.lat, flight.lon) < 1.5);
      if (sampleFlight) {
        showSampleFlightInfo(sampleFlight);
        return;
      }
      let place = LUNAR_PLACES.find((entry) => entry.name === item.name);
      if (!place) {
        place = LUNAR_PLACES
          .map((entry) => ({ entry, separation: angleBetweenSitesDeg(item.lat, item.lon, entry.lat, entry.lon) }))
          .filter((match) => match.separation < 4)
          .sort((a, b) => a.separation - b.separation)[0]?.entry;
      }
      const details = place || item;
      document.getElementById('feature-info-category').textContent = details.group || t('bilgi.etiket_yok');

    function showSampleAlternatives(flight) {
      const minDistanceKm = 500;
      const alternatives = [];
      for (const candidate of lastRankedSouthSites) {
        if (candidate.lat > -65) continue;
        const referenceDistance = 2 * landingParameters.lunarRadiusKm * Math.sin(
          THREE.MathUtils.degToRad(angleBetweenSitesDeg(flight.lat, flight.lon, candidate.lat, candidate.lon)) / 2
        );
        if (referenceDistance < minDistanceKm) continue;
        const separated = alternatives.every((chosen) => {
          const distance = 2 * landingParameters.lunarRadiusKm * Math.sin(
            THREE.MathUtils.degToRad(angleBetweenSitesDeg(chosen.lat, chosen.lon, candidate.lat, candidate.lon)) / 2
          );
          return distance >= minDistanceKm;
        });
        if (separated) alternatives.push({ ...candidate, distanceFromTargetKm: referenceDistance });
        if (alternatives.length === 3) break;
      }

      sfdAlternativeListEl.replaceChildren();
      if (!alternatives.length) {

          document.getElementById('feature-info-category').textContent = t('alt.kategori', { ad: flight.shortTitle });
          document.getElementById('feature-info-title').textContent = alternative.name;
          document.getElementById('feature-info-coordinates').textContent = t('bilgi.koordinatlar', { k: `${alternative.lat.toFixed(2)}° ${t('yon.g')}, ${alternative.lon.toFixed(2)}°` });
          document.getElementById('feature-info-description').textContent = t('alt.aciklama', { ad: flight.shortTitle });
          document.getElementById('feature-info-detail-label').textContent = t('alt.detay_etiket');
          document.getElementById('feature-info-detail-label').hidden = false;
          document.getElementById('feature-info-detail').textContent = t('alt.detay', { km: alternative.distanceFromTargetKm.toFixed(0), gun: alternative.maxSunWindowDays.toFixed(1) });
          document.getElementById('feature-info-detail').hidden = false;
          document.getElementById('feature-info-parameters').hidden = false;
          document.getElementById('feature-info-source').href = 'https://science.nasa.gov/moon/';
          document.getElementById('feature-info-source').textContent = t('bilgi.kaynak_kaynaklar');
          document.getElementById('feature-info-panel').hidden = false;
        });
        item.append(summary, goButton);
        sfdAlternativeListEl.appendChild(item);
      });
      sfdAlternativesEl.hidden = false;
    }

    sfdAlternativeBtn.addEventListener('click', () => {
      if (activeSampleFlight?.statusType === 'planned') showSampleAlternatives(activeSampleFlight);
    });

    sfdFpBtn.addEventListener('click', () => {
      if (!activeSampleFlight) return;
      if (isFirstPersonView) {
        flyToLatLon(activeSampleFlight.lat, activeSampleFlight.lon, activeSampleFlight.name, 1.20);
        sfdFpBtn.textContent = t('ornek.fp');
      } else {
        enterFirstPersonAtCandidate({ lat: activeSampleFlight.lat, lon: activeSampleFlight.lon, name: activeSampleFlight.name });
      }
    });

    applyProjectionState();
    updateLandingSite(-89.9, 0.0);

    let isPlaying = false;
    const slider = document.getElementById('timeline-slider');
    const timeLabel = document.getElementById('current-time-label');
    const playBtn = document.getElementById('play-pause-btn');
    const powerStatus = document.getElementById('power-status');
    const dateInput = document.getElementById('mission-date');
    const missionTimeInput = document.getElementById('mission-time');
    const missionDialog = document.getElementById('mission-dialog');

    const landingParameters = {
      lunarRadiusKm: 1737.4,
      maxSlopeDeg: 8,
      minContinuousSunDays: 6.5,
      panelAreaM2: 36,
      solarFluxWm2: 1360.8,
      demResolutionM: 10,
      sunAngularRadiusMinDeg: 0.261,
      maxSubsolarLatitudeDeg: 1.59
    };

    function updateLivePowerStatus() {
      const site = trackedSite || { lat: -89.9, lon: 0.0, name: 'Shackleton C1', illuminationRatio: 0.921 };
      const effectiveLat = Math.abs(site.lat) > 85 ? (site.lat >= 0 ? 84.5 : -84.5) : site.lat;
      const localNorm = latLonToUnitVector(effectiveLat, site.lon);
      const worldNorm = localNorm.clone().applyAxisAngle(UP_Y, moonMesh.rotation.y).normalize();
      const toSun = sunPosition.clone().sub(moonPosition).normalize();
      const sinElev = worldNorm.dot(toSun);
      const elevDeg = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(sinElev, -1, 1)));
      const panelMaxKw = (landingParameters.panelAreaM2 * landingParameters.solarFluxWm2) / 1000;
      const output = document.getElementById('selected-site-evidence');

      if (elevDeg > -landingParameters.sunAngularRadiusMinDeg) {
        const effFactor = site.illuminationRatio
          ? site.illuminationRatio
          : THREE.MathUtils.clamp(Math.sin(THREE.MathUtils.degToRad(Math.max(elevDeg, 6))), 0.18, 1.0);
        const kw = (panelMaxKw * effFactor).toFixed(1);
        powerStatus.className = 'status-badge status-ok';
        powerStatus.textContent = t('guc.var', { kw });
        if (output) {
          output.textContent = t('guc.var_ayrinti', { ad: site.name, yuk: Math.max(0.1, elevDeg).toFixed(1), kw });
        }
      } else {
        powerStatus.className = 'status-badge status-shadow';
        powerStatus.textContent = t('guc.yok');
        if (output) {
          output.textContent = t('guc.yok_ayrinti', { ad: site.name, yuk: elevDeg.toFixed(1) });
        }
      }
    }

    renderSampleFlightCard(activeSampleFlight);

    const documentedSiteEvidence = {
      '-89.9,0.0': { referenceName: 'Shackleton C1 Ridge', illuminationAt2m: 0.921 },
      '-89.4,222.5': { referenceName: 'Connecting Ridge', illuminationAt2m: 0.9227, illuminationAt10m: 0.9565 }
    };

    const southHemisphereGrid = [];
    for (let lat = -2.5; lat > -90; lat -= 5) {
      for (let lon = -180; lon < 180; lon += 10) southHemisphereGrid.push({ lat, lon, evidence: null });
    }
    southHemisphereGrid.push(
      { lat: -89.9, lon: 0, evidence: documentedSiteEvidence['-89.9,0.0'] },
      { lat: -89.4, lon: -137.5, evidence: documentedSiteEvidence['-89.4,222.5'] }
    );
    let lastRankedSouthSites = [];
    let lastAutoRecommendationDay = null, recommendationTimer = null;

    function recommendLandingSite(simulationHours = Number(slider.value), force = false) {
      const missionDate = new Date(`${dateInput.value}T${missionTimeInput.value || '00:00'}:00`);
      missionDate.setHours(missionDate.getHours() + simulationHours);
      const recommendationDay = Math.floor(missionDate.getTime() / 86400000);
      if (!force && recommendationDay === lastAutoRecommendationDay) return;
      lastAutoRecommendationDay = recommendationDay;

      const epochMs = Date.UTC(2000, 0, 6, 18, 14), synodicPeriodDays = 29.53059, sampleHours = 3;
      const sampleCount = Math.ceil((synodicPeriodDays * 24) / sampleHours);
      const samples = [];
      for (let i = 0; i < sampleCount; i++) {
        const daysFromEpoch = (missionDate.getTime() + i * sampleHours * 3600000 - epochMs) / 86400000;
        const solarLongitude = THREE.MathUtils.degToRad(((daysFromEpoch / synodicPeriodDays) * 360) % 360);
        const solarDeclination = THREE.MathUtils.degToRad(landingParameters.maxSubsolarLatitudeDeg * Math.sin((daysFromEpoch / 365.25) * Math.PI * 2));
        samples.push({ solarLongitude, sinDeclination: Math.sin(solarDeclination), cosDeclination: Math.cos(solarDeclination) });
      }

      const sunLimbSin = Math.sin(THREE.MathUtils.degToRad(-landingParameters.sunAngularRadiusMinDeg));
      const ranked = southHemisphereGrid.map((candidate) => {
        const lat = THREE.MathUtils.degToRad(candidate.lat), lon = THREE.MathUtils.degToRad(candidate.lon);
        const sinLat = Math.sin(lat), cosLat = Math.cos(lat);
        let run = 0, maxRun = 0, leadingRun = 0, stillLeading = true, trailingRun = 0, currentElevation = 0;
        for (let i = 0; i < samples.length; i++) {
          const s = samples[i];
          const sinElevation = sinLat * s.sinDeclination + cosLat * s.cosDeclination * Math.cos(lon - s.solarLongitude);
          if (i === 0) currentElevation = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(sinElevation, -1, 1)));
          if (sinElevation >= sunLimbSin) {
            run++;
            maxRun = Math.max(maxRun, run);
            if (stillLeading) leadingRun++;
            trailingRun = run;
          } else {
            run = 0;
            stillLeading = false;
            trailingRun = 0;
          }
        }
        const maxSunWindowDays = Math.min(sampleCount, Math.max(maxRun, leadingRun + trailingRun)) * sampleHours / 24;
        const score = maxSunWindowDays * 100 + currentElevation + (candidate.evidence?.illuminationAt2m ?? 0) * 0.001;
        return { ...candidate, elevation: currentElevation, maxSunWindowDays, score };
      }).sort((a, b) => b.score - a.score);
      lastRankedSouthSites = ranked;

      const thresholdCandidates = ranked.filter((c) => c.maxSunWindowDays >= landingParameters.minContinuousSunDays);
      const eligible = thresholdCandidates.length >= 5 ? thresholdCandidates : ranked;
      const recommendations = [], minSeparationKm = 500;
      for (const candidate of eligible) {
        const farEnough = recommendations.every((chosen) => {
          const lat1 = THREE.MathUtils.degToRad(chosen.lat), lat2 = THREE.MathUtils.degToRad(candidate.lat);
          const a = Math.sin((lat2 - lat1) / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(THREE.MathUtils.degToRad(candidate.lon - chosen.lon) / 2) ** 2;
          return 2 * landingParameters.lunarRadiusKm * Math.asin(Math.sqrt(Math.min(1, a))) >= minSeparationKm;
        });
        if (farEnough) recommendations.push(candidate);
        if (recommendations.length === 5) break;
      }

      const selected = recommendations[0] || ranked[0];
      recommendations.forEach((c, idx) => { c.name = t('oneri.aday_adi', { n: idx + 1 }); });
      renderRecommendationMarkers(recommendations);
      document.getElementById('best-site').textContent = selected.name || t('oneri.aday');

      const resultDate = missionDate.toLocaleString(yerel, { dateStyle: 'medium', timeStyle: 'short' });
      const panelIncidentKw = landingParameters.panelAreaM2 * landingParameters.solarFluxWm2 / 1000;
      document.getElementById('result-scan-info').textContent = t('oneri.tarama', { n: southHemisphereGrid.length, km: minSeparationKm });
      document.getElementById('result-candidate-list').replaceChildren(...recommendations.map((candidate, index) => {
        const item = document.createElement('li');
        const illumination = candidate.evidence ? t('oneri.kaynak_ort', { p: (candidate.evidence.illuminationAt2m * 100).toFixed(2) }) : t('oneri.kaynak_yok');
        const row = document.createElement('div');
        row.className = 'candidate-row';
        const details = document.createElement('span');
        details.textContent = t('oneri.ayrinti', { k: `${candidate.lat.toFixed(2)}°, ${candidate.lon.toFixed(2)}°`, gun: candidate.maxSunWindowDays.toFixed(1), yuk: candidate.elevation.toFixed(1), kaynak: illumination });
        const actions = document.createElement('div');
        actions.className = 'candidate-actions';
        const goButton = document.createElement('button');
        goButton.type = 'button';
        goButton.className = 'candidate-go';
        goButton.textContent = t('oneri.git');
        goButton.addEventListener('click', () => goToLandingCandidate(candidate));
        const fpButton = document.createElement('button');
        fpButton.type = 'button';
        fpButton.className = 'candidate-go';
        fpButton.textContent = t('oneri.fp');
        fpButton.addEventListener('click', () => enterFirstPersonAtCandidate(candidate));
        actions.append(goButton, fpButton);
        row.append(details, actions);
        item.replaceChildren(row);
        return item;
      }));

      document.getElementById('result-mission-time').textContent = t('oneri.zaman', { z: resultDate });
      document.getElementById('result-site-name').textContent = selected.name;
      document.getElementById('result-site-coordinates').textContent = t('bilgi.koordinatlar', { k: `${selected.lat.toFixed(2)}°, ${selected.lon.toFixed(2)}°` });
      document.getElementById('result-solar-elevation').textContent = t('oneri.yukseklik', { yuk: selected.elevation.toFixed(1) });
      document.getElementById('result-illumination').textContent = selected.evidence
        ? t('oneri.aydinlanma', { p: (selected.evidence.illuminationAt2m * 100).toFixed(2), alan: landingParameters.panelAreaM2, kw: (panelIncidentKw * selected.evidence.illuminationAt2m).toFixed(1) })
        : t('oneri.aydinlanma_yok');
      document.getElementById('result-sun-check').textContent = selected.elevation > -landingParameters.sunAngularRadiusMinDeg
        ? t('oneri.gunes_ustte')
        : t('oneri.gunes_altta');
      document.getElementById('result-slope-check').textContent = t('oneri.egim', { e: landingParameters.maxSlopeDeg });
      document.getElementById('result-duration-check').textContent = t('oneri.sure', { gun: selected.maxSunWindowDays.toFixed(1), esik: landingParameters.minContinuousSunDays });
      document.getElementById('result-dem-check').textContent = t('oneri.dem', { m: landingParameters.demResolutionM });
      if (!activeSampleFlight) {
        trackedSite = { lat: selected.lat, lon: selected.lon, name: selected.name, illuminationRatio: selected.evidence?.illuminationAt2m ?? null };
        updateLandingSite(selected.lat, selected.lon, true);
      }
      updateLivePowerStatus();
    }

    function updateSiteEvidence(evidence, estimatedElevation) {
      updateLivePowerStatus();
    }

    function updateSimulationTime(stepValue, forceRecommendation = false, debounceRecommendation = false) {
      const hours = Number(stepValue);
      const baseDate = new Date(`${dateInput.value}T${missionTimeInput.value || '00:00'}:00`);
      baseDate.setHours(baseDate.getHours() + hours);

      const dayCount = Math.floor(hours / 24);
      const formattedDate = baseDate.toLocaleDateString(yerel, { day: 'numeric', month: 'short', year: 'numeric' });
      const formattedTime = baseDate.toLocaleTimeString(yerel, { hour: '2-digit', minute: '2-digit' });

      timeLabel.textContent = t('zaman.deger', { tarih: formattedDate, saat: formattedTime, gun: dayCount });
      document.getElementById('selected-mission-datetime').textContent = t('zaman.oneri', { tarih: formattedDate, saat: formattedTime });
      document.getElementById('result-mission-time').textContent = t('oneri.zaman', { z: `${formattedDate}, ${formattedTime}` });

      const prevMoonPos = moonPosition.clone();
      const prevMoonAngle = moonMesh.rotation.y;
      const earthAngle = (hours / (365 * 24)) * Math.PI * 2;
      const moonAngle = initialMoonPhase + (hours / (27.3 * 24)) * Math.PI * 2;
      earthPosition.set(Math.cos(earthAngle) * earthSunDistance, 0, Math.sin(earthAngle) * earthSunDistance);
      earthModelGroup.position.copy(earthPosition);
      earthModelGroup.rotation.y = (hours / 24) * Math.PI * 2;
      sunModelGroup.rotation.y = (hours / (25.38 * 24)) * Math.PI * 2;
      moonPosition.set(earthPosition.x + Math.cos(moonAngle) * earthMoonDistance, 0, earthPosition.z + Math.sin(moonAngle) * earthMoonDistance);
      moonMesh.position.copy(moonPosition);
      moonMesh.rotation.y = moonAngle;
      if (!isGlobeProjection()) projectionMapGroup.quaternion.copy(moonMesh.quaternion).invert();

      const rotatedLandingLocal = currentLandingLocal.clone().applyAxisAngle(UP_Y, moonAngle);
      const rotatedLandingNormal = currentLandingNormal.clone().applyAxisAngle(UP_Y, moonAngle);
      landingFocusTarget.copy(moonPosition).add(rotatedLandingLocal).addScaledVector(rotatedLandingNormal, -moonSurfaceRadius * 0.08);
      updateLivePowerStatus();

      if (debounceRecommendation) {
        clearTimeout(recommendationTimer);
        recommendationTimer = setTimeout(() => recommendLandingSite(hours, true), 150);
      } else {
        clearTimeout(recommendationTimer);
        recommendationTimer = null;
        recommendLandingSite(hours, forceRecommendation);
      }

      if (isFirstPersonView && isGlobeProjection()) {
        const rotationDelta = moonAngle - prevMoonAngle;
        const cameraOffset = camera.position.clone().sub(prevMoonPos).applyAxisAngle(UP_Y, rotationDelta);
        const targetOffset = controls.target.clone().sub(prevMoonPos).applyAxisAngle(UP_Y, rotationDelta);
        camera.position.copy(moonPosition).add(cameraOffset);
        controls.target.copy(moonPosition).add(targetOffset);
        camera.up.applyAxisAngle(UP_Y, rotationDelta).normalize();
        cameraFlight = null;
      } else if (gamepadActive && isGlobeProjection()) {
        const moonDelta = moonPosition.clone().sub(prevMoonPos);
        camera.position.add(moonDelta);
        controls.target.add(moonDelta);
      } else {
        const focusTarget = resolveFocusTarget();
        const focusShift = focusTarget.clone().sub(controls.target);
        controls.target.add(focusShift);
        camera.position.add(focusShift);
      }
    }

    slider.addEventListener('input', (e) => updateSimulationTime(e.target.value, false, true));
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = t(isPlaying ? 'zaman.durdur' : 'zaman.oynat');
    });

    function animateTimeline() {
      if (isPlaying) {
        let val = Number(slider.value) + 1;
        if (val > 720) val = 0;
        slider.value = val;
        updateSimulationTime(val);
      }
    }

    document.getElementById('mission-date-button').addEventListener('click', () => missionDialog.showModal());
    document.getElementById('mission-dialog-cancel').addEventListener('click', () => missionDialog.close());
    document.getElementById('mission-form').addEventListener('submit', (event) => {
      event.preventDefault();
      missionDialog.close();
      showRecommendationMarkers = true;
      isFirstPersonView = false;
      updateSimulationTime(slider.value, true);
      document.getElementById('landing-result-panel').hidden = false;
    });
    document.getElementById('landing-result-close').addEventListener('click', () => {
      document.getElementById('landing-result-panel').hidden = true;
    });
    document.getElementById('feature-info-close').addEventListener('click', () => {
      document.getElementById('feature-info-panel').hidden = true;
    });
    document.getElementById('body-focus').addEventListener('change', (e) => focusBody(e.target.value));
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      animateTimeline();
      syncGraticuleToMoon();
      if (cameraFlight) {
        const progress = Math.min((performance.now() - cameraFlight.startedAt) / cameraFlight.duration, 1);
        const eased = progress * progress * (3 - 2 * progress);
        camera.position.lerpVectors(cameraFlight.fromPosition, cameraFlight.toPosition, eased);
        controls.target.lerpVectors(cameraFlight.fromTarget, cameraFlight.toTarget, eased);
        if (isGlobeProjection() && !isFirstPersonView && activeFocus === 'moon') {
          const center = moonMesh.position;
          const d0 = cameraFlight.fromPosition.distanceTo(center);
          const d1 = cameraFlight.toPosition.distanceTo(center);
          const desiredDist = Math.max(THREE.MathUtils.lerp(d0, d1, eased), getMinMoonCameraDistance(camera.position));
          const dir = camera.position.clone().sub(center);
          if (dir.lengthSq() < 1e-6) dir.set(0, 1, 0);
          camera.position.copy(center).addScaledVector(dir.normalize(), desiredDist);
        }
        if (progress >= 1) cameraFlight = null;
      }
      if (!gamepadActive) {
        controls.update();
      }
      enforceMoonSurfaceCollision();
      if (gamepadActive && isGlobeProjection()) {
        applyGamepadCameraPose();
      }
      renderer.render(scene, camera);
    }

    updateSimulationTime(slider.value, true);
    animate();
    requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.dataset.yukleme = 'ilk'; }));
    loadModels();
  </script>
